name: Package the extension

on:
  push:
    tags: ["ext-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build Chrome and Firefox packages
        run: node extension/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: buscapiso-extension
          path: extension/dist/buscapiso-*.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/ext-v')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/dist/buscapiso-*.zip
