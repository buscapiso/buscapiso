[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buscapiso"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.50",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "PyYAML>=6",
    "pydantic>=2.11",
    "fastapi>=0.140",
    "uvicorn>=0.50",
    "keyring>=25",
    "anthropic>=1.12",
    "segno>=1.6",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.13"]
build = ["pyinstaller>=6.20"]

[project.scripts]
buscapiso = "buscapiso.cli:main"

[tool.setuptools.packages.find]
include = ["buscapiso*"]

[tool.setuptools.package-data]
buscapiso = ["datos/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: abre Chromium headless contra el servidor local; necesita la web compilada",
           "playwright_driver: arranca el driver de Playwright (sin navegador)"]
