SO PISO REFORMADO A ESTRENAR EN EL REALEJO\",\"description\":\"Vivienda de un dormitorio situada en pleno centro de Granada, en el emblem\u00E1tico barrio del Realejo, dentro de una preciosa corrala granadina con mucho encanto y una comunidad especialmente tranquila.\\n\\nEl piso ha sido reformado integralmente y se encuentra a estrenar, ofreciendo espacios actuales y funcionales sin perder el car\u00E1cter propio del edificio. Destaca especialmente su cocina completamente nueva con pen\u00EDnsula, equipada con lavavajillas y lavadora integrados. El resto de electrodom\u00E9sticos podr\u00E1n proporcionarse en funci\u00F3n de las necesidades del inquilino.\\n\\nEl edificio dispone de ascensor y cuenta con una ubicaci\u00F3n privilegiada, a pocos minutos a pie de algunos de los principales puntos de inter\u00E9s de Granada, comercios, restauraci\u00F3n, servicios y transporte p\u00FAblico.\\n\\nCondiciones del alquiler:\\n\\n- Exclusivamente alquiler de temporada, con una duraci\u00F3n inferior a un a\u00F1o.\\n- Dirigido a estudiantes o trabajadores que puedan acreditar el car\u00E1cter temporal de su estancia en Granada.\\n- Fianza obligatoria de 2 mensualidades (1.800 \u20AC).\\n- Se solicitar\u00E1 documentaci\u00F3n que permita acreditar solvencia econ\u00F3mica: n\u00F3minas, contrato de trabajo, avales u otra documentaci\u00F3n equivalente.\\n- Suministros a cargo del arrendatario. Comunidad e IBI a cargo de la parte arrendadora.\\n\\nUna vivienda ideal para quienes buscan instalarse temporalmente en Granada disfrutando de una ubicaci\u00F3n c\u00E9ntrica, tranquila y con todas las comodidades.\\n\\nNota: Las superficies expresadas en esta publicaci\u00F3n tienen car\u00E1cter descriptivo y son aproximadas. Los precios pueden ser susceptibles de modificaci\u00F3n sin previo aviso. Algunos elementos decorativos mostrados en las fotograf\u00EDas, como cojines, plantas y otros accesorios, no est\u00E1n incluidos en el alquiler.\",\"location\":{\"visibility\":\"EX blicaci\u00F3n del inmueble no garantiza su disponibilidad; consultar siempre.\\nAlquiler de larga estancia destinado a vivienda habitual.\\nSuministros no incluidos en el precio del alquiler.\\nEl arrendatario deber\u00E1 abonar 490 \u20AC en concepto de servicios de gesti\u00F3n, que incluyen asesoramiento previo, verificaci\u00F3n de documentaci\u00F3n, gesti\u00F3n administrativa del expediente y asistencia en la firma del contrato.\\nDichos servicios no constituyen honorarios por intermediaci\u00F3n inmobiliaria ni gastos de formalizaci\u00F3n del contrato, y son independientes de los servicios prestados por la agencia al arrendador.\\nLa aceptaci\u00F3n del arrendatario corresponde exclusivamente a la propiedad, previa valoraci\u00F3n de la documentaci\u00F3n presentada.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Granada Capital\",\"district\":\"Centro\",\"region\":\"Vega de Granada\",\"province\":\"Granada\",\"address\":{\"streetName\":\"Calle Puentezuelas\",\"streetNumber\":\"15\"},\"coordinates\":{\"latitude\":37.17441479815233,\"longitude\":-3.6027401597349353},\"displayAddressLine\":\"Calle Puentezuelas\",\"displayZoneLine\":\"Centro, Granada Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Centro - Sagrario\",\"slug\":\"centro-sagrario\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Andaluc\u00EDa\",\"slug\":\"andalucia\"},{\"type\":\"province\",\"value\":\"Granada\",\"slug\":\"granada\"},{\"type\":\"region\",\"value\":\"Vega de Granada\",\"slug\":\"vega-de-granada\"},{\"type\":\"area\",\"value\":\"Granada, Zona de\",\"slug\":\"granada-zona-de\"},{\"type\":\"municipality\",\"value\":\"Granada Capital\",\"slug\":\"granada-capital\"},{\"type\":\"district\",\"value\":\"Centro\",\"slug\":\"centro\"},{\"type\":\"street\",\"value\":\"Calle Moral de la Magdalena\",\"slug\":\"calle-moral-de-la-magdalena\"},{\"type\":\"street\",\"value\":\"Calle Parraga\",\"slug\ e al mar! Te presentamos este magn\u00EDfico piso en alquiler para la temporada escolar, ubicado en primera l\u00EDnea de playa en La Herradura. Con 111 m\u00B2 construidos y 100 m\u00B2 \u00FAtiles, este inmueble ofrece todo lo que necesitas para disfrutar de una experiencia de vida costera incomparable. Totalmente amueblado y listo para entrar a vivir, no tendr\u00E1s que preocuparte por nada.\\r\\n\\r\\nLa vivienda cuenta con 3 dormitorios espaciosos equipados con armarios empotrados y 2 ba\u00F1os completos que garantizan comodidad para toda la familia. El gran sal\u00F3n comedor es el coraz\u00F3n del hogar, perfecto para reuniones y momentos de convivencia. La cocina independiente viene completamente amueblada y equipada, facilitando tu d\u00EDa a d\u00EDa. Desde la terraza con vistas al mar podr\u00E1s disfrutar de atardeceres inolvidables mientras respiras el aire fresco del oc\u00E9ano.\\r\\n\\r\\nUbicado en la planta 2 con acceso exterior, el piso dispone de ascensor para mayor comodidad. La vivienda est\u00E1 completamente adaptada para personas con movilidad reducida, garantizando accesibilidad total. Adem\u00E1s, incluye plaza de garaje privada y trastero, ofreciendo soluciones pr\u00E1cticas de almacenamiento. El edificio cuenta con piscina comunitaria, un plus de entretenimiento y bienestar.\\r\\n\\r\\nConstruido en 1994 y en buen estado de conservaci\u00F3n, con orientaci\u00F3n Oeste que proporciona excelente iluminaci\u00F3n natural. Aunque no dispone de calefacci\u00F3n, el clima de La Herradura lo hace innecesario. Clase energ\u00E9tica G. \u00A1No dejes pasar esta oportunidad \u00FAnica de vivir en primera l\u00EDnea de playa! [IW]\",\"location\":{\"visibility\":\"EXACT\",\"municipality\":\"Almu\u00F1\u00E9car\",\"district\":\"La Herradura\",\"region\":\"Costa Tropical\",\"province\":\"Granada\",\"address\":{\"streetName\":\"Andr\u00E9s Segovia\",\"streetNumber\":\"7\"},\"coordinates\":{\"latitude\":36.730648670695,\"longitude\":-3.7369879504468 R\",\"NEARBY_PUBLIC_TRANSPORT\"],\"hasNot\":[]},\"heating\":\"NON_SPECIFIED\",\"energyEfficiencyCertificate\":{\"status\":\"PENDING\"},\"dynamicFeatures\":[\"IS_TEMPORARY\"]},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":950,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"i.ivercasainmobiliaria.4365@inmovilla.com\",\"phone\":\"+34958535455\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/genil/granada-capital/0d06ece9-06c2-4faa-b152-3acd48f5610d/d\",\"feature\":null,\"short\":\"/a/0d06ece9-06c2-4faa-b152-3acd48f5610d\"}},{\"id\":\"f8e0f19d-f0a6-41c4-8d88-dab9c956ab59\",\"reference\":\"13817\",\"legacyNumericId\":\"39499000001511\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/apartamento/calle-elvira-65/centro/granada-capital/f8e0f19d-f0a6-41c4-8d88-dab9c956ab59/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/granada-provincia/granada-capital/centro/s\",\"summary\":{\"title\":\"\uD83C\uDFE1 APARTAMENTO EN CALLE ELVIRA \u2013 CENTRO DE GRANADA\",\"description\":\"SOLO ESTUDIANTES CON AVAL SOLVENTE\\n\\n\uD83D\uDCC5 Contrato temporal \u2013 hasta 11 meses\\n\\n\u2728 Bonito apartamento reformado, con mucho encanto y una ubicaci\u00F3n inmejorable en pleno centro de Granada.\\n\\nLa vivienda cuenta con un agradable balc\u00F3n con vistas a la calle Elvira, aire acondicionado y una distribuci\u00F3n tipo d\u00FAplex que le aporta un toque diferente y acogedor.\\n\\nEn la planta principal encontramos un sal\u00F3n c\u00F3modo y luminoso junto a una cocina equipada con electrodom\u00E9sticos y un ba\u00F1o completo. En la parte superior se encuentra el dormitorio, creando un espacio independiente y muy acogedor.\\n\\n\uD83D\uDCCD Ubicaci\u00F3n fant\u00E1stica, en plena calle Elvira, una de las zonas con m\u00E1s ambiente y tradici\u00F3n de Granada. A pocos minutos caminando de Gran V\u00EDa, Plaza Nueva, Catedral y Puerta Real, con todo tipo de servicios alrededor: supermercados, comercios, cafeter\u00EDas, restaurantes y transporte p\u00FAblico.\\n\\nAdem\u00E1s, se encuentra muy cerca de las principales facultades y zonas universitarias, por lo que es una opci\u00F3n ideal para estudiantes de posgrado, trabajadores o personas que busquen disfrutar del centro de Granada durante una estancia temporal.\\n\\n\u2728 Una vivienda con encanto, reformada y lista para entrar a vivir en una de las ubicaciones m\u00E1s demandadas de Granada.\\n\\n\uD83D\uDCCC Notas y pol\u00EDtica de gesti\u00F3n\\n\\nLa publicaci\u00F3n del inmueble no garantiza su disponibilidad; consultar siempre.\\nAlquiler exclusivamente por temporada, con contratos de m\u00E1ximo 11 meses (uso no habitual).\\nArrendamiento no sujeto a la Ley de Vivienda 12/2023.\\nSuministros y honorarios inmobiliarios no incluidos.\\nLa aceptaci\u00F3n del arrendatario queda a criterio exclusivo de la propiedad, previa valoraci\u00F3n de la documentaci\u00F3n presentada. Se precisa avalista con suficiente solvencia econ\u00F3mica.\",\"location\":{\"visibility\":\"EXACT\",\"municipality\":\"Granada Capital\",\"district\":\"Centro\",\"region\":\"Vega de Granada\",\"province\":\"Granada\",\"address\":{\"streetName\":\"Calle Elvira\",\"streetNumber\":\"65\"},\"coordinates\":{\"latitude\":37.1789819,\"longitude\":-3.598548},\"displayAddressLine\":\"Calle Elvira 65\",\"displayZoneLine\":\"Centro, Granada Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Centro - Sagrario\",\"slug\":\"centro-sagrario\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Andaluc\u00EDa\",\"slug\":\"andalucia\"},{\"type\":\"province\",\"value\":\"Granada\",\"slug\":\"granada\"},{\"type\":\"region\",\"value\":\"Vega de Granada\",\"slug\":\"vega-de-granada\"},{\"type\":\"area\",\"value\":\"Granada, Zona de\",\"slug\":\"granada-zona-de\"},{\"type\":\"municipality\",\"value\":\"Granada Capital\",\"slug\":\"granada-capital\"},{  coraz\u00F3n de Granada\",\"description\":\"\u00BFBuscas un piso c\u00F3modo, totalmente equipado y en pleno centro de Granada para una estancia temporal? Este piso de 2 dormitorios es la opci\u00F3n perfecta para profesionales desplazados, visitantes por motivos laborales o personales, o quienes desean vivir en el coraz\u00F3n de la ciudad durante unos meses, con todas las comodidades. \u2728 Caracter\u00EDsticas destacadas: \uD83D\uDECF\uFE0F 2 dormitorios amplios, ambos completamente amueblados, con zonas de almacenaje. \uD83D\uDECB\uFE0F Sal\u00F3n espacioso y muy luminoso, con acceso a dos balcones exteriores que llenan el espacio de luz natural todo el d\u00EDa. \uD83C\uDF7D\uFE0F Cocina totalmente equipada con electrodom\u00E9sticos y menaje, lista para entrar a vivir. \uD83D\uDEBF 2 ba\u00F1os completos, ideal para para quienes valoran el confort. \uD83C\uDF1E Vivienda muy luminosa y bien distribuida. \uD83D\uDCCD Ubicaci\u00F3n inmejorable: Situado en pleno centro de Granada, rodeado de todos los servicios: supermercados, transporte p\u00FAblico, restaurantes, zonas de ocio, cultura y mucho m\u00E1s. Disponibilidad y condiciones: \uD83D\uDDD3\uFE0F Alquiler temporal: m\u00EDnimo 6 meses \u2013 m\u00E1ximo 12 meses . \uD83D\uDCB0 Condiciones econ\u00F3micas: 2 meses de fianza + 2 meses de garant\u00EDa adicional. Se requiere avalar con una propiedad libre de cargas. \uD83E\uDDFE Requisitos de solvencia inquilino: Contrato indefinido. Se debe justificar que el 30 % de los ingresos netos mensuales superen el importe del alquiler mensual. Dicha documentaci\u00F3n debe ser aportada antes de agendar visita. Otros detalles: Los suministros (agua, luz, gas) corren por cuenta del inquilino. La comunidad e IBI est\u00E1n incluidos en la renta. M\u00E1ximo dos ocupantes. No se admiten ni\u00F1os. No se admiten mascotas. No est\u00E1 permitido fumar o vapear Si valoras la ubicaci\u00F3n, el confort y la tranquilidad en pleno centro de Granada, este piso est\u00E1 hecho para ti. \uD83D\uDCE9 Cont\u00E1ctanos para m\u00E1s informaci\u00F3n o para iniciar el proceso de valoraci\u00F3n. N\u00BA de registro de alquiler de corta duraci\u00F3n: ESFCNT00001801700076580700000000000000000000000000009\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Granada Capital\",\"district\":\"Centro\",\"region\":\"Vega de Granada\",\"province\":\"Granada\",\"address\":{\"streetName\":\"Plaza del Campillo\",\"streetNumber\":\"n\u00BA1\"},\"coordinates\":{\"latitude\":37.17236091471573,\"longitude\":-3.5977892698191454},\"displayAddressLine\":\"Plaza del Campillo\",\"displayZoneLine\":\"Centro, Granada Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"San Mat\u00EDas - Realejo\",\"slug\":\"san-matias-realejo\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Andaluc\u00EDa\",\"slug\":\"andalucia\"},{\"type\":\"province\",\"value\":\"Granada\",\"slug\":\"granada\"},{\"type\":\"region\",\"value\":\"Vega de Granada\",\"slug\":\"vega-de-granada\"},{\"type\":\"area\",\"value\":\"Granada, Zona de\",\"slug\":\"granada-zona-de\"},{\"type\":\"municipality\",\"value\":\"Granada Capital\",\"slug\":\"granada-capital\"},{\"type\":\"district\",\"value\":\"Centro\",\"slug\":\"centro\"},{\"type\":\"street\",\"value\":\"Calle San Matias\",\"slug\":\"calle-san-matias\"},{\"type\":\"street\",\"value\":\"Calle Acera del Darro\",\"slug\":\"calle-acera-del-darro\"},{\"type\":\"street\",\"value\":\"Calle Puente Casta\u00F1eda\",\"slug\":\"calle-puente-castaneda\"},{\"type\":\"street\",\"value\":\"Calle Almona del Campillo\",\"slug\":\"calle-almona-del-campillo\"},{\"type\":\"street\",\"value\":\"Calle Andorra\",\"slug\":\"calle-andorra\"},{\"type\":\"street\",\"value\":\"Plaza del Campillo Bajo\",\"slug\":\"plaza-del-campillo-bajo\"},{\"type\":\"street\",\"value\":\"Calle Navas\",\"slug\":\"calle-navas\"},{\"type\":\"street\",\"value\":\"Plaza de Bibataubin\",\"slug\":\"plaza-de-bibat
