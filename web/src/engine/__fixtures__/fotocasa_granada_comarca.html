olor":"#F5F5F5","logo":null,"textColor":"#1D1D1D"},"buildingSubtype":"Flat","buildingType":"Flat","clientAlias":"Grupo Inmobiliario Farahome","clientId":9202773586546,"clientType":"professional","clientTypeId":3,"clientUrl":"/es/pro/grupo-inmobiliario-farahome/","coordinates":{"latitude":37.177370435803,"longitude":-3.6053183852387,"accuracy":1},"date":{"diff":2,"unit":"DAYS","timestamp":1791488010707},"dateOriginal":{"diff":2,"unit":"DAYS","timestamp":1791488010707},"description":"¿Buscas una habitación para el próximo curso y quieres tener tu propio espacio para descansar, estudiar y organizarte?\n\nEsta vivienda está pensada para compartir con comodidad, con habitaciones equipadas y amplias zonas comunes preparadas para el día a día.\n\nSe alquila por habitaciones mediante contrato temporal hasta julio de 2027, ideal para estudiantes y otros perfiles que necesiten una estancia temporal durante este periodo.\n\nHABITACIONES Y PRECIOS\n\n• HABITACIÓN 1 – INDIVIDUAL JUNTO AL COMEDOR | 350 €/MES\nHabitación amplia con armario empotrado, escritorio y silla. Cuenta con cama nido con dos colchones y cajonera de almacenamiento bajo la cama.\n\n• HABITACIÓN 2 – DOBLE | 390 €/MES\nHabitación equipada con cama, armario, escritorio y silla, creando un espacio propio para descansar y estudiar.\n\n• HABITACIÓN 3 – DOBLE | 390 €/MES\nTambién equipada con cama, armario, escritorio y silla.\n\nESPACIOS COMUNES\n\nLa vivienda dispone de diferentes estancias independientes para facilitar la convivencia:\n\n• Salón independiente.\n• Comedor independiente con zona de despensa/almacenaje y aire acondicionado mediante split.\n• Cocina independiente, amueblada y equipada.\n• Menaje y equipamiento necesario para el día a día.\n• 1 aseo y 1 baño.\n• Espacio adicional de almacenaje para maletas, cajas, material u otros objetos.\n• Balcón exterior con acceso desde uno de los dormitorios.\n\nLIMPIEZA DE ZONAS COMUNES INCLUIDA\n\nPara facilitar la convivencia y mantener los espacios compartidos en buenas condiciones, la vivienda incluye limpieza profesional cada 15 días de las zonas comunes: cocina, salón, comedor, baños y demás espacios compartidos.\n\nTODO PREPARADO PARA TU ESTANCIA\n\nLa vivienda está equipada para que puedas instalarte sin tener que empezar desde cero. Cada habitación cuenta con su propio espacio de descanso y estudio, mientras que las zonas comunes ofrecen amplitud y diferentes ambientes para el día a día.\n\nCONDICIONES DEL ALQUILER\n\n• Alquiler por habitaciones.\n• Contrato temporal hasta julio de 2027.\n• Perfil preferente: estudiantes y personas que necesiten una estancia temporal acreditada por motivos académicos, profesionales, prácticas, formación u otras circunstancias similares.\n• Estudio de solvencia y viabilidad del perfil.\n• Será necesario aportar la documentación correspondiente y podrá solicitarse avalista.\n• 1 mensualidad de fianza.\n• 1 mensualidad de honorarios de agencia + IVA.\n• Suministros no incluidos: agua, electricidad e internet.\n• Limpieza de zonas comunes incluida cada 15 días.\n\n¿BUSCAS HABITACIÓN PARA EL PRÓXIMO CURSO?\n\nSi quieres conocer la vivienda, contacta con FARAHOME, indícanos tus fechas y el perfil de habitación que buscas y te informaremos de la disponibilidad y condiciones.\n\nEn FARAHOME te acompañamos durante todo el proceso con cercanía, transparencia y asesoramiento profesional.\n\n━━━━━━━━━━━━━━━━━━\n\nAVISO LEGAL\n\n⚠ Las superficies, medidas y distribución indicadas son aproximadas y de carácter meramente descriptivo, pudiendo existir diferencias respecto de las medidas reales o de la documentación de la vivienda.\n⚠ Las fotografías y la información publicada tienen carácter informativo y pueden existir pequeñas diferencias respecto a la situación o equipamiento de la vivienda en el momento de la visita.\n⚠ La disponibilidad, renta y condiciones del alquiler podrán variar sin previo aviso.\n⚠ La información contenida en este anuncio puede estar sujeta a errores u omisiones invol s://static.fotocasa.es/images/ads/8c6bce24-50b3-4122-977e-1ca6ff21ecad?rule=original","roomType":"bedroom"}],"otherFeaturesCount":0,"periodicityId":0,"phone":"+34637641924","price":"300 €","promotionId":0,"promotionLogo":"https://static.fotocasa.es/images/client/9202760267451/673066.jpg?rule=original","promotionUrl":null,"promotionTitle":null,"promotionTypologiesCounter":null,"promotionTypologies":[],"parent":null,"publisherId":"c09e530a-8acd-4647-bf60-e4ef82a3c663","rawPrice":300,"realEstateAdId":"b9267b8b-6d3c-4947-a4b0-8e6fb726ccb3","reducedPrice":null,"subtypeId":1,"transactionTypeId":5,"typeId":2,"userId":null},{"accuracy":true,"address":{"country":"España","district":"Chana","neighborhood":"Angustias - Chana - Encina","zipCode":"18015","municipality":"Granada","province":"Granada","city":"Granada","cityZone":null,"county":"Vega de Granada","regionLevel1":"Andalucía","regionLevel2":"Granada","upperLevel":"Angustias - Chana - Encina"},"brandInfo":{"barColor":"#F5F5F5","logo":null,"textColor":"#1D1D1D"},"buildingSubtype":"Flat","buildingType":"Flat","clientAlias":"Grupo Inmobiliario Farahome","clientId":9202773586546,"clientType":"professional","clientTypeId":3,"clientUrl":"/es/pro/grupo-inmobiliario-farahome/","coordinates":{"latitude":37.189676399635,"longitude":-3.623561636888,"accuracy":1},"date":{"diff":2,"unit":"DAYS","timestamp":1791488555783},"dateOriginal":{"diff":2,"unit":"DAYS","timestamp":1791488555783},"description":"TU HABITACIÓN, TU LLAVE, TU ESPACIO\n\n¿Necesitas alojamiento temporal en Granada? Esta vivienda completamente reformada, exterior y muy luminosa se alquila por habitaciones, con estancias independientes y llave propia.\n\nIdeal para estudiantes y otros perfiles que necesiten una vivienda temporal durante unos meses.\n\nHABITACIONES Y PRECIOS\n\n• HABITACIÓN 1 – INDIVIDUAL | 250 €\nExterior, equipada con cama, armario, escritorio, silla, espejo, perchero, aire acondicionado frío/calor y llave propia.\n\n• HABITACIÓN 2 – INDIVIDUAL CON BALCÓN | 250 €\nExterior, con balcón independiente, cama, armario, escritorio, silla, aire acondicionado frío/calor y llave propia.\n\n• HABITACIÓN 3 – INDIVIDUAL | 220 €\nEquipada con cama, armario, escritorio, silla, espejo, perchero, aire acondicionado frío/calor y llave propia.\n\n• HABITACIÓN 4 – DOBLE | 280 €\nHabitación amplia con cama doble, armario, escritorio, silla, espejo, perchero, aire acondicionado frío/calor y llave independiente.\n\nPRECIO DE LANZAMIENTO\n\nActualmente puedes encontrar una habitación desde 220 € al mes. Las habitaciones se irán alquilando y el precio indicado corresponderá a la disponibilidad existente en cada momento.\n\nConsulta qué habitación está disponible y su precio actual.\n\nUNA VIVIENDA PREPARADA PARA COMPARTIR\n\nPiso completamente exterior y luminoso, situado en segunda planta sin ascensor.\n\nCuenta con salón-comedor con TV, balcón y aire acondicionado frío/calor.\n\nCocina independiente totalmente equipada con frigorífico combi, congelador adicional, horno, placa, campana, microondas, lavavajillas y menaje.\n\nBaño reformado con ducha, lavadora-secadora, termo eléctrico y ventana.\n\nLas ventanas son oscilobatientes y disponen de sistema de ventilación para favorecer la renovación del aire y reducir la condensación.\n\nInternet instalado e incluido en el precio.\n\nCONDICIONES\n\n• Alquiler por habitaciones.\n• Estancia mínima de 3 meses.\n• Contrato temporal hasta julio de 2027.\n• Preferentemente estudiantes y perfiles con necesidad de estancia temporal.\n• Cada habitación dispone de llave propia.\n• Se solicitará documentación para acreditar la solvencia económica. En estudiantes podrá aportarse documentación del avalista.\n• La documentación será estudiada previamente para comprobar la viabilidad del alquiler.\n\n⚠ IMPORTANTE: hasta julio de 2027 se alquila por habitaciones. A partir de esa fecha, la vivienda dejará de ofrecerse por habitaciones y se alquilará completa de uso temporal.\n\nUBICACIÓN\nPróximo a Facultad de Bellas Artes, ETSIIT, MEDAC Granada e IES Virgen de las Nieves, además de transporte público y todo tipo de servicios.\n\n📲 ¿Te interesa? Contacta con FARAHOME indicando tus fechas de estancia y qué tipo de habitación buscas. Te informaremos de la disponibilidad y condiciones.\n\nEn FARAHOME te acompañamos con cercanía, transparencia y asesoramiento profesional.\n⚠ Las superficies, medidas y distribución son aproximadas y de carácter descriptivo. Las fotografías y la información publicada tienen carácter informativo. Disponibilidad, precios y condiciones pueden variar sin previo aviso. La información puede estar sujeta a errores u omisiones involuntarias.","detail":{"es-ES":"/es/compartir/vivienda/granada-capital/aire-acondicionado-calefaccion-amueblado/191064780/d"},"detailWithParams":{"es-ES":"/es/compartir/vivienda/granada-capital/aire-acondicionado-calefaccion-amueblado/191064780/d?from=list"},"dynamicFeatures":["IS_EXTERIOR","IS_SHARED","IS_TEMPORARY"],"externalContactUrl":null,"features":[{"key":"air_conditioner","value":1,"maxValue":0,"minValue":0},{"key":"heating","value":3,"maxValue":0,"minValue":0},{"key":"furnished","value":19,"maxValue":0,"minValue":0},{"key":"household_appliances","value":21,"maxValue":0,"minValue":0},{"key":"balcony","value":32,"maxValue":0,"minValue":0},{"key":"equiped_kitchen","value":131,"maxValue":0,"minValue":0},{"key":"antiquity","value":7,"maxValue":0,"minValue":0},{"key":"bathrooms","value":1,"maxValue":0,"minValue":0},{"key":"conservationStatus","value":8,"maxValue":0,"minValue":0},{"key":"floor","value":7,"maxValue":0,"minValue":0},{"key":"hotWater","value":2,"maxValue":0,"minValue":0},{"key":"orientation","value":4,"maxValue":0,"minValue":0},{"key":"rooms","value":4,"maxValue":0,"minValue":0},{"key":"surface","value":79,"maxValue":0,"minValue":0}],"hasListLogo":true,"hasPhoneVisibility":true,"hasSubsidies":true,"hasVideo":0,"hasQualitySeal":false,"hasFloorPlans":false,"id":191064780,"isBareOwnership":false,"isCompleted" Url":null,"coordinates":{"latitude":37.18800438797157,"longitude":-3.614755421876907,"accuracy":1},"date":{"diff":32,"unit":"DAYS","timestamp":1788883955813},"dateOriginal":{"diff":32,"unit":"DAYS","timestamp":1788883955813},"description":"\n¡UNA HABITACIÓN DISPONIBLE!\n\nSomos dos chicos, estudiantes de primer curso de grado, ordenados y tranquilos, que buscamos un tercer compañero hasta final de curso. El piso tiene calefacción central y agua caliente central, y está situado en una de las zonas más demandadas de Granada, junto al Camino de Ronda, con excelente comunicación mediante transporte público y rodeado de todo tipo de servicios, comercios, supermercados, cafeterías y gimnasios. Se encuentra a 10 minutos de la facultad de Ciencias, y a no más de 20 de las facultades de Bellas Artes y de Ingeniería Informática y Telecomunicaciones pero gracias al metro y el autobús, tiene una ubicación excelente para llegar a cualquier otra facultad en pocos minutos.\n\nLa habitación libre da a una calle muy tranquila, sin ruido, y tiene mucha luz. Tiene mesa de estudio y una cama nido, muy útil por si tienes visita, con un gran mueble de almacenamiento alrededor. Pero además, la habitación cuenta con un armario empotrado en la pared contraria a la ventana.\n\nDispone de un amplio y luminoso salón comedor, con aire acondicionado, con acceso directo a una terraza cubierta que da a la calle.\n\nLa vivienda tiene dos cuartos de baño completos con bañera, ambos con acceso desde el pasillo.\n\nLa cocina independiente, dotada de ventana y mesa, está totalmente equipada con electrodomésticos: lavavajillas, horno, frigorífico, microondas, vitrocerámica y todo lo necesario para una estancia confortable. Además, cuenta con un lavadero independiente, en el que se encuentra la lavadora, que también es secadora.\n\nEl inmueble también dispone de calefacción central y agua caliente central, idea para olvidarse de calentadores, calderas o molestas bombonas, y reducir al mínimo los gastos de luz.\n\nLos gastos de comunidad y calefacción están incluidos en el precio. Sólo se pide un mes de fianza. Pregúntanos y ven a ver el piso. ¡Te encantará!\n\n","detail":{"es-ES":"/es/compartir/vivienda/granada-capital/aire-acondicionado-ascensor-patio-amueblado-television/190702146/d"},"detailWithParams":{"es-ES":"/es/compartir/vivienda/granada-capital/aire-acondicionado-ascensor-patio-amueblado-television/190702146/d?from=list"},"dynamicFeatures":["FOR_STUDENTS","IS_SHARED"],"externalContactUrl":null,"features":[{"key":"air_conditioner","value":1,"maxValue":0,"minValue":0},{"key":"cabinets","value":2,"maxValue":0,"minValue":0},{"key":"elevator","value":13,"maxValue":0,"minValue":0},{"key":"yard","value":16,"maxValue":0,"minValue":0},{"key":"furnished","value":19,"maxValue":0,"minValue":0},{"key":"household_appliances","value":21,"maxValue":0,"minValue":0},{"key":"oven","value":22,"maxValue":0,"minValue":0},{"key":"washing_machine","value":23,"maxValue":0,"minValue":0},{"key":"microwave","value":24,"maxValue":0,"minValue":0},{"key":"fridge","value":25,"maxValue":0,"minValue":0},{"key":"tv","value":29,"maxValue":0,"minValue":0},{"key":"balcony","value":32,"maxValue":0,"minValue":0},{"key":"armored_door","value":84,"maxValue":0,"minValue":0},{"key":"laundry","value":109,"maxValue":0,"minValue":0},{"key":"antiquity","value":5,"maxValue":0,"minValue":0},{"key":"bathrooms","value":1,"maxValue":0,"minValue":0},{"key":"conservationStatus","value":2,"maxValue":0,"minValue":0},{"key":"orientation","value":8,"maxValue":0,"minValue":0},{"key":"rooms","value":2,"maxValue":0,"minValue":0},{"key":"surface","value":110,"maxValue":0,"minValue":0}],"hasListLogo":false,"hasPhoneVisibility":false,"hasSubsidies":true,"hasVideo":0,"hasQualitySeal":false,"hasFloorPlans":false,"id":190702146,"isBareOwnership":false,"isCompleted":null,"isDiscarded":false,"isExternalContact":false,"isHighlighted":false,"isMainTypology":false,"isNew":false,"isNewConstruction":false,"isOccupied":false,"isAu IOS\n\n• HABITACIÓN 1 – INDIVIDUAL JUNTO AL COMEDOR | 350 €/MES\nHabitación amplia con armario empotrado, escritorio y silla. Cuenta con cama nido con dos colchones y cajonera de almacenamiento bajo la cama.\n\n• HABITACIÓN 2 – DOBLE | 390 €/MES\nHabitación equipada con cama, armario, escritorio y silla, creando un espacio propio para descansar y estudiar.\n\n• HABITACIÓN 3 – DOBLE | 390 €/MES\nTambién equipada con cama, armario, escritorio y silla.\n\nESPACIOS COMUNES\n\nLa vivienda dispone de diferentes estancias independientes para facilitar la convivencia:\n\n• Salón independiente.\n• Comedor independiente con zona de despensa/almacenaje y aire acondicionado mediante split.\n• Cocina independiente, amueblada y equipada.\n• Menaje y equipamiento necesario para el día a día.\n• 1 aseo y 1 baño.\n• Espacio adicional de almacenaje para maletas, cajas, material u otros objetos.\n• Balcón exterior con acceso desde uno de los dormitorios.\n\nLIMPIEZA DE ZONAS COMUNES INCLUIDA\n\nPara facilitar la convivencia y mantener los espacios compartidos en buenas condiciones, la vivienda incluye limpieza profesional cada 15 días de las zonas comunes: cocina, salón, comedor, baños y demás espacios compartidos.\n\nTODO PREPARADO PARA TU ESTANCIA\n\nLa vivienda está equipada para que puedas instalarte sin tener que empezar desde cero. Cada habitación cuenta con su propio espacio de descanso y estudio, mientras que las zonas comunes ofrecen amplitud y diferentes ambientes para el día a día.\n\nCONDICIONES DEL ALQUILER\n\n• Alquiler por habitaciones.\n• Contrato temporal hasta julio de 2027.\n• Perfil preferente: estudiantes y personas que necesiten una estancia temporal acreditada por motivos académicos, profesionales, prácticas, formación u otras circunstancias similares.\n• Estudio de solvencia y viabilidad del perfil.\n• Será necesario aportar la documentación correspondiente y podrá solicitarse avalista.\n• 1 mensualidad de fianza.\n• 1 mensualidad de honorarios de agencia + IVA.\n• Suministros no incluidos: agua, electricidad e internet.\n• Limpieza de zonas comunes incluida cada 15 días.\n\n¿BUSCAS HABITACIÓN PARA EL PRÓXIMO CURSO?\n\nSi quieres conocer la vivienda, contacta con FARAHOME, indícanos tus fechas y el perfil de habitación que buscas y te informaremos de la disponibilidad y condiciones.\n\nEn FARAHOME te acompañamos durante todo el proceso con cercanía, transparencia y asesoramiento profesional.\n\n━━━━━━━━━━━━━━━━━━\n\nAVISO LEGAL\n\n⚠ Las superficies, medidas y distribución indicadas son aproximadas y de carácter meramente descriptivo, pudiendo existir diferencias respecto de las medidas reales o de la documentación de la vivienda.\n⚠ Las fotografías y la información publicada tienen carácter informativo y pueden existir pequeñas diferencias respecto a la situación o equipamiento de la vivienda en el momento de la visita.\n⚠ La disponibilidad, renta y condiciones del alquiler podrán variar sin previo aviso.\n⚠ La información contenida en este anuncio puede estar sujeta a errores u omisiones involuntarias.","location":"Granada, Granada","locationCardView":{"address":"Calle GRAN CAPITAN 25, Centro","zone":"Granada, Granada","municipality":"Centro","locality":"Granada"},"detailUrl":"/es/compartir/vivienda/granada-capital/aire-acondicionado-calefaccion-parking-ascensor-amueblado/191064687/d","features":[{"key":"antiquity","value":7,"minValue":0,"maxValue":0},{"key":"bathrooms","value":2,"minValue":0,"maxValue":0},{"key":"conservationStatus","value":8,"minValue":0,"maxValue":0},{"key":"floor","value":6,"minValue":0,"maxValue":0},{"key":"hotWater","value":2,"minValue":0,"maxValue":0},{"key":"orientation","value":5,"minValue":0,"maxValue":0},{"key":"rooms","value":3,"minValue":0,"maxValue":0},{"key":"surface","value":126,"minValue":0,"maxValue":0}],"multimedia":[{"position":1,"roomType":"exterior","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/8c533c76-c8e2-4c18-8fef-36c14e4fd152?rule=original","src":"https adicional, horno, placa, campana, microondas, lavavajillas y menaje.\n\nBaño reformado con ducha, lavadora-secadora, termo eléctrico y ventana.\n\nLas ventanas son oscilobatientes y disponen de sistema de ventilación para favorecer la renovación del aire y reducir la condensación.\n\nInternet instalado e incluido en el precio.\n\nCONDICIONES\n\n• Alquiler por habitaciones.\n• Estancia mínima de 3 meses.\n• Contrato temporal hasta julio de 2027.\n• Preferentemente estudiantes y perfiles con necesidad de estancia temporal.\n• Cada habitación dispone de llave propia.\n• Se solicitará documentación para acreditar la solvencia económica. En estudiantes podrá aportarse documentación del avalista.\n• La documentación será estudiada previamente para comprobar la viabilidad del alquiler.\n\n⚠ IMPORTANTE: hasta julio de 2027 se alquila por habitaciones. A partir de esa fecha, la vivienda dejará de ofrecerse por habitaciones y se alquilará completa de uso temporal.\n\nUBICACIÓN\nPróximo a Facultad de Bellas Artes, ETSIIT, MEDAC Granada e IES Virgen de las Nieves, además de transporte público y todo tipo de servicios.\n\n📲 ¿Te interesa? Contacta con FARAHOME indicando tus fechas de estancia y qué tipo de habitación buscas. Te informaremos de la disponibilidad y condiciones.\n\nEn FARAHOME te acompañamos con cercanía, transparencia y asesoramiento profesional.\n⚠ Las superficies, medidas y distribución son aproximadas y de carácter descriptivo. Las fotografías y la información publicada tienen carácter informativo. Disponibilidad, precios y condiciones pueden variar sin previo aviso. La información puede estar sujeta a errores u omisiones involuntarias.","location":"Granada, Granada","locationCardView":{"address":"Calle MAESTRO MORENO TORROBA 5, Chana","zone":"Granada, Granada","municipality":"Chana","locality":"Granada"},"detailUrl":"/es/compartir/vivienda/granada-capital/aire-acondicionado-calefaccion-amueblado/191064780/d","features":[{"key":"antiquity","value":7,"minValue":0 ia para cada uno y buen cuidado de las zonas comunes.\n\nSi estás interesado/a, puedes escribirme contando brevemente a qué te dedicas, cuándo necesitarías entrar y cuánto tiempo tienes previsto quedarte.","location":"Granada, Granada","locationCardView":{"address":"Avenida de Juan Pablo II 19, Beiro","zone":"Granada, Granada","municipality":"Beiro","locality":"Granada"},"detailUrl":"/es/compartir/vivienda/granada-capital/aire-acondicionado-calefaccion-terraza-ascensor-patio-amueblado-television/190974561/d","features":[{"key":"antiquity","value":5,"minValue":0,"maxValue":0},{"key":"bathrooms","value":2,"minValue":0,"maxValue":0},{"key":"conservationStatus","value":2,"minValue":0,"maxValue":0},{"key":"floor","value":10,"minValue":0,"maxValue":0},{"key":"hotWater","value":2,"minValue":0,"maxValue":0},{"key":"orientation","value":5,"minValue":0,"maxValue":0},{"key":"rooms","value":2,"minValue":0,"maxValue":0},{"key":"surface","value":90,"minValue":0,"maxValue":0}],"multimedia":[{"position":1,"roomType":"bedroom","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/c4c4b070-737d-4023-9261-55854a0e2a32?rule=original","src":"https://static.fotocasa.es/images/ads/c4c4b070-737d-4023-9261-55854a0e2a32?rule=original"},{"position":2,"roomType":"bedroom","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/cb882179-5856-437d-932a-ffc163b86896?rule=original","src":"https://static.fotocasa.es/images/ads/cb882179-5856-437d-932a-ffc163b86896?rule=original"},{"position":3,"roomType":"bedroom","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/95bdb5e7-9008-4a8b-884f-3aaa69090b74?rule=original","src":"https://static.fotocasa.es/images/ads/95bdb5e7-9008-4a8b-884f-3aaa69090b74?rule=original"},{"position":4,"roomType":"bedroom","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/e069843f-8e22-4dbe-94f3-c1b172aaf120?rule=original","src":"https://static.fotocasa.es/images/ads/e069843f-8e22-4dbe-94f3-c1b172aaf120?r \nSomos dos chicos, estudiantes de primer curso de grado, ordenados y tranquilos, que buscamos un tercer compañero hasta final de curso. El piso tiene calefacción central y agua caliente central, y está situado en una de las zonas más demandadas de Granada, junto al Camino de Ronda, con excelente comunicación mediante transporte público y rodeado de todo tipo de servicios, comercios, supermercados, cafeterías y gimnasios. Se encuentra a 10 minutos de la facultad de Ciencias, y a no más de 20 de las facultades de Bellas Artes y de Ingeniería Informática y Telecomunicaciones pero gracias al metro y el autobús, tiene una ubicación excelente para llegar a cualquier otra facultad en pocos minutos.\n\nLa habitación libre da a una calle muy tranquila, sin ruido, y tiene mucha luz. Tiene mesa de estudio y una cama nido, muy útil por si tienes visita, con un gran mueble de almacenamiento alrededor. Pero además, la habitación cuenta con un armario empotrado en la pared contraria a la ventana.\n\nDispone de un amplio y luminoso salón comedor, con aire acondicionado, con acceso directo a una terraza cubierta que da a la calle.\n\nLa vivienda tiene dos cuartos de baño completos con bañera, ambos con acceso desde el pasillo.\n\nLa cocina independiente, dotada de ventana y mesa, está totalmente equipada con electrodomésticos: lavavajillas, horno, frigorífico, microondas, vitrocerámica y todo lo necesario para una estancia confortable. Además, cuenta con un lavadero independiente, en el que se encuentra la lavadora, que también es secadora.\n\nEl inmueble también dispone de calefacción central y agua caliente central, idea para olvidarse de calentadores, calderas o molestas bombonas, y reducir al mínimo los gastos de luz.\n\nLos gastos de comunidad y calefacción están incluidos en el precio. Sólo se pide un mes de fianza. Pregúntanos y ven a ver el piso. ¡Te encantará!\n\n","location":"Granada, Granada","locationCardView":{"address":"Camino de Ronda 197, Chana","zone":"Granada, Gra
