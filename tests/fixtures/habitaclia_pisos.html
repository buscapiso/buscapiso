50eb200c3cd\",\"reference\":\"AB2602070-1\",\"legacyNumericId\":\"4737003827304\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/carrer-d-ausias-marc/eixample/barcelona-capital/e0ce93b5-21c1-4495-b23b-450eb200c3cd/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/eixample/s\",\"summary\":{\"title\":\"Piso en alquiler en Eixample, Barcelona\",\"description\":\"PISO REFORMADO DE 4 HABITACIONES EN L'EIXAMPLE\\n\\nEn pleno Eixample de Barcelona, a pocos minutos de Passeig de Sant Joan y Pla\u00E7a de Catalunya, se encuentra este elegante piso reformado de 150 m\u00B2, completamente amueblado y ubicado en una distinguida finca cl\u00E1sica de principios del siglo XX. Una propiedad que combina el encanto de la arquitectura modernista con el confort contempor\u00E1neo, ideal para quienes buscan amplitud, car\u00E1cter y una ubicaci\u00F3n c\u00E9ntrica para disfrutar de la ciudad con todas las comodidades al alcance.\\n\\nLa vivienda se distribuye de forma equilibrada entre una luminosa zona de d\u00EDa orientada al mar y una tranquila zona de noche orientada a la monta\u00F1a, favoreciendo la ventilaci\u00F3n cruzada y la entrada de luz natural durante todo el d\u00EDa. El amplio sal\u00F3n-comedor conecta con una agradable galer\u00EDa con vistas a un silencioso patio de manzana, un espacio perfecto para desconectar en pleno centro urbano. La cocina abierta, equipada con electrodom\u00E9sticos de alta gama, se integra de manera natural en la estancia principal. Dispone de cuatro habitaciones dobles, incluyendo una suite principal con vestidor y ba\u00F1o privado, adem\u00E1s de otros dos ba\u00F1os completos.\\n\\nVivir en el Eixample significa disfrutar de algunos de los mejores restaurantes, comercios, galer\u00EDas y espacios culturales de Barcelona. Su excelente conexi\u00F3n con el resto de la ciudad y la cercan\u00EDa a zonas emblem\u00E1ticas convierten esta ubicaci\u00F3n en una de las m\u00E1s demandadas tanto por profesionales internacionales como por familias que valoran un estilo de vida urbano, c\u00F3modo y sofisticado.\\n\\nLos techos altos, los suelos hidr\u00E1ulicos originales, las molduras decorativas y los acabados de calidad aportan personalidad a una vivienda lista para entrar a vivir. Una oportunidad excepcional para disfrutar de una de las direcciones m\u00E1s deseadas de Barcelona. Para m\u00E1s informaci\u00F3n sobre esta propiedad y otras viviendas exclusivas en la ciudad, contacte con aProperties Real Estate.\\n\\nLa finalidad del contrato es temporal.   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario no ostenta la condici\u00F3n de gran tenedor.\\n Ref. AB2602070-1\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB01453516***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Eixample\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer d'Ausi\u00E0s Marc\",\"streetNumber\":\"52\"},\"coordinates\":{\"latitude\":41.393706365947835,\"longitude\":2.1795702407840736},\"displayAddressLine\":\"Carrer d'Ausi\u00E0s Marc\",\"displayZoneLine\":\"Eixample, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Fort Pienc\",\"slug\":\"fort-pienc\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type  la azotea.\\n\\nDispone de una serie de servicios incluidos en el alquiler: suministros agua,luz y WIFI incluido en el precio. Servicio de limpieza y cambio de s\u00E1banas y toallas una vez por semana, servicio de mantenimiento, tel\u00E9fono de asistencia las  24 horas, sistema de seguridad las 24 horas, parking para bicicletas y patinetes .\\n\\nAdem\u00E1s, dispone de una gran variedad de servicios adicionales a disposici\u00F3n del cliente.\\n\\nAceptan mascotas.\\n\\nLa finalidad del contrato es temporal.\\n\\n   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2211110-1\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB03736422***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Eixample\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"C. del Consell de Cent\",\"streetNumber\":\"288\"},\"coordinates\":{\"latitude\":41.38954517261418,\"longitude\":2.164403074584925},\"displayAddressLine\":\"C. del Consell de Cent\",\"displayZoneLine\":\"Eixample, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Dreta de l'Eixample\",\"slug\":\"dreta-de-l-eixample\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\
