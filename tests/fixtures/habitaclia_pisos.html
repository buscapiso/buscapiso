:[],\"documents\":[],\"counts\":{\"images\":45,\"videos\":0,\"threeD\":0,\"floorPlans\":0}},\"publisher\":{\"id\":\"dfdaf8c1-fb0f-403c-9d98-52af68d09143\",\"name\":\"MONIKA R\u00DCSCH\",\"tradeName\":\"MONIKA R\u00DCSCH\",\"logo\":\"https://static.fotocasa.es/images/client/9202753807547/609019.jpg?rule=original\",\"website\":\"monikarusch.com/es\",\"navigationUrl\":\"/inmobiliaria/monika-rusch/\",\"legacyPublisherId\":\"5903\",\"officeCode\":\"1\",\"isAgent\":false},\"products\":{\"opportunity\":true,\"premium\":true,\"priorityTier\":\"premium\",\"leaderModule\":false,\"expressVisit\":false},\"publisherProducts\":[\"LOGO_EN_PARRILLA\",\"MINISITE\",\"SBLR\"],\"updatedAt\":\"2026-10-05T15:26:53.9960348+02:00\"},\"property\":{\"propertyType\":\"flat\",\"propertySubtype\":\"flat\",\"status\":\"PRETTY_GOOD\",\"rooms\":3,\"bathrooms\":2,\"builtSurface\":195,\"landArea\":null,\"floor\":\"FOURTH\",\"features\":{\"has\":[\"ELEVATOR\",\"SECURITY_DOOR\",\"AIR_CONDITIONER\",\"WARDROBES\",\"EQUIPPED_KITCHEN\"],\"hasNot\":[]},\"orientation\":\"WEST\",\"heating\":\"NON_SPECIFIED\",\"energyEfficiencyCertificate\":{\"data\":{\"consumption\":{\"label\":\"C\",\"value\":56},\"emissions\":{\"label\":\"C\",\"value\":10}},\"status\":\"AVAILABLE\"},\"dynamicFeatures\":[\"IS_EXTERIOR\"]},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":4469,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"w3895@inmoweb.email\",\"phone\":\"+34932045520\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/eixample/barcelona-capital/03118011-96e2-45f7-bed5-f58f05f7232a/d\",\"feature\":null,\"short\":\"/a/03118011-96e2-45f7-bed5-f58f05f7232a\"}},{\"id\":\"014dca68-1aa8-4b49-b049-13b2a036824f\",\"reference\":\"CA3\",\"legacyNumericId\":\"9863004320227\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/carrer-del-capita-arenas-3/les-corts/barcelona-capital/014dca68-1aa8-4b49-b049-13b2a036824f/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/les-corts/s\",\"summary\":{\"title\":\"\u00A1Vive en el Coraz\u00F3n de Barcelona en este Exclusivo y Luminoso Piso con Terraza!\",\"description\":\"Ubicaci\u00F3n Premium, Dise\u00F1o Elegante y Comodidad \u00DAnica\\n\\nImagina vivir en uno de los barrios m\u00E1s codiciados de Barcelona, en un piso que lo tiene todo: luz natural, vistas despejadas, espacios amplios y una reforma reciente que aporta estilo y funcionalidad. Este exclusivo piso en la Diagonal, ubicado en una finca con conserje y dos ascensores, ha sido dise\u00F1ado para ofrecerte lo mejor en confort y calidad de vida. \u00A1Tu nuevo hogar te est\u00E1 esperando!\\n\\nDistribuci\u00F3n Perfecta para Tu Comodidad\\n\\nEste hogar ocupa toda una planta, con dos accesos que permiten una distribuci\u00F3n fluida y c\u00F3moda. Al entrar, ser\u00E1s recibido por un espacioso hall que te llevar\u00E1 a una cocina independiente y moderna, equipada con gran capacidad de almacenamiento y un pr\u00E1ctico lavadero. Adem\u00E1s, cuenta con un \u00E1rea extra que puedes adaptar a tus necesidades, ya sea como habitaci\u00F3n de servicio o despensa.\\n\\nA tu izquierda, un sal\u00F3n de generosas dimensiones, con grandes ventanales que permiten que la luz inunde el espacio. Desde el sal\u00F3n, accedes a una terraza privada con impresionantes vistas a la Diagonal, perfecta para disfrutar de tus momentos de relax al aire libre.\\n\\nZonas de Noche para Toda la Familia\\n\\nLa zona de descanso de este espectacular piso te ofrece 4 habitaciones dobles, todas exteriores y llenas de luz. La suite principal, con vestidor y ba\u00F1o privado, tiene acceso directo a la terraza, convirti\u00E9ndola en tu peque\u00F1o refugio. Las otras habitaciones, amplias y confortables, ideal para disfrutar de tranquilidad y vistas a la zona norte de la ciudad.\\n\\nCalidad en Cada Detalle\\n\\nEste hogar est\u00E1 equipado con calefacci\u00F3n individual a gas y aire acondicionado por conductos, para garantizar tu bienestar todo el a\u00F1o. Los suelos de parquet de madera noble a\u00F1aden calidez al espacio, mientras que la cocina y los ba\u00F1os cuentan con acabados en terrazo de alta gama, que aportan elegancia y durabilidad.\\n\\nZonas Comunes para Disfrutar en Familia\\n\\nImagina tener acceso a una zona comunitaria con espacios verdes, un parque infantil y una zona deportiva, todo a tu disposici\u00F3n. Adem\u00E1s, la propiedad incluye una plaza de parking de gran tama\u00F1o y un trastero de 10 m\u00B2, lo que te ofrece una comodidad extra y mucho espacio para almacenamiento.\\n\\nTodo lo que Necesitas a tu Alcance\\n\\nEste piso est\u00E1 en la ubicaci\u00F3n perfecta: a pocos pasos de transporte p\u00FAblico, tiendas, restaurantes y zonas de ocio. Vivir en la Diagonal te permite disfrutar de la calma y el lujo de una zona residencial, sin perderte la vibrante vida urbana de Barcelona.\\n\\nNo Dejes Pasar Esta Oportunidad \u00DAnica\\n\\nEste es m\u00E1s que un piso, es tu nuevo hogar. No dejes pasar la oportunidad de vivir en una de las zonas m\u00E1s exclusivas de la ciudad. \u00A1Solicita tu visita hoy mismo y ven a descubrir todo lo que este espectacular piso tiene para ofrecer!\\n\\nZONA TENSIONADA\\nPROPIEDAD NO GRAN TENEDORA\\nEste inmueble cuenta con una superficie superior a 150 m\u00B2, por lo que no dispone de \u00EDndice de referencia de precios de alquiler publicado por el Ministerio de Vivienda.\",\"location\":{\"visibility\":\"EXACT\",\"municipality\":\"Barcelona Capital\",\"district\":\"Les Corts\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer del Capit\u00E0 Arenas\",\"streetNumber\":\"3\"},\"coordinates\":{\"latitude\":41.3892013,\"longitude\":2.1265986},\"displayAddressLine\":\"Carrer del Capit\u00E0 Arenas 3\",\"displayZoneLine\":\"Les Corts, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Pedralbes\",\"slug\":\" property\":{\"propertyType\":\"flat\",\"propertySubtype\":\"flat\",\"status\":\"ALMOST_NEW\",\"rooms\":5,\"bathrooms\":3,\"builtSurface\":232,\"landArea\":null,\"constructionYear\":1983,\"terrace\":{\"surface\":10,\"has\":false},\"floor\":\"SIXTH\",\"features\":{\"has\":[\"ELEVATOR\",\"PETS_ALLOWED\",\"EQUIPPED_KITCHEN\",\"WARDROBES\",\"STORAGE_ROOM\",\"PRIVATE_PARKING\",\"YARD\",\"AIR_CONDITIONER\",\"NEARBY_PUBLIC_TRANSPORT\",\"LAUNDRY\",\"COMMUNITY_AREA\",\"OFFICE_KITCHEN\",\"DOORMAN\",\"SUITE_BATHROOM\",\"PARQUET\",\"BALCONY\",\"HOME_APPLIANCES\"],\"hasNot\":[\"FURNISHED\",\"PRIVATE_GARDEN\",\"SECURITY_DOOR\",\"COMMUNITY_POOL\",\"PRIVATE_POOL\",\"FIREPLACE\",\"ALARM\",\"SURVEILLANCE_SYSTEM\",\"JACUZZI\",\"SAUNA\",\"TENNIS_COURT\",\"GYM\",\"SPORTS_AREA\",\"CHILDREN_AREA\",\"HOME_AUTOMATION\",\"INTERNET\",\"STONEWARE\",\"OVEN\",\"WASHING_MACHINE\",\"DISHWASHER\",\"MICROWAVE\",\"FRIDGE\",\"DRYER\",\"TV\"]},\"orientation\":\"SOUTH\",\"heating\":\"NATURAL_GAS\",\"hotWater\":\"NATURAL_GAS\",\"energyEfficiencyCertificate\":{\"data\":{\"consumption\":{\"label\":\"F\",\"value\":133},\"emissions\":{\"label\":\"F\",\"value\":33}},\"status\":\"AVAILABLE\"}},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":5635,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"eruiz@revelbcn.com\",\"phone\":\"+34633582257\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/carrer-del-capita-arenas-3/les-corts/barcelona-capital/014dca68-1aa8-4b49-b049-13b2a036824f/d\",\"feature\":null,\"short\":\"/a/014dca68-1aa8-4b49-b049-13b2a036824f\"}},{\"id\":\"05579552-2fa2-4842-8366-1ed80fb5277b\",\"reference\":\"AB2608002\",\"legacyNumericId\":\"53846000000165\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/vivienda/calle-caponata/sarria-sant-gervasi/barcelona-capital/05579552-2fa2-4842-8366-1ed80fb5277b/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/sarria-sant-gervasi/s\",\"summary\":{\"title\":\"Magn\u00EDfico bajo d\u00FAplex de obra nueva con gran jard\u00EDn y piscina salina privada en Sarri\u00E0 Barcelona\",\"description\":\"MAGN\u00CDFICO BAJO D\u00DAPLEX DE OBRA NUEVA CON JARD\u00CDN Y PISCINA PRIVADA EN SARRI\u00C0, BARCELONA\\r\\n\\r\\nDesde SIGNATURE Luxury Homes by Grupo Signature presentamos esta exclusiva vivienda de obra nueva en formato d\u00FAplex, situada en Sarri\u00E0, una de las zonas residenciales m\u00E1s consolidadas de Barcelona.\\r\\n\\r\\nLa vivienda destaca por su dise\u00F1o contempor\u00E1neo, su distribuci\u00F3n funcional y, especialmente, por sus amplios espacios exteriores de uso privativo.\\r\\n\\r\\nEn la planta principal encontramos un luminoso sal\u00F3n-comedor con cocina integrada, concebido como un espacio abierto y conectado directamente con el jard\u00EDn. En esta misma planta dispone de un ba\u00F1o completo.\\r\\n\\r\\nEl exterior constituye uno de los principales elementos diferenciales de la propiedad, con jard\u00EDn privado y piscina salina de uso exclusivo, creando un entorno especialmente agradable para disfrutar de Barcelona con privacidad y comodidad.\\r\\n\\r\\nLa planta superior est\u00E1 destinada a la zona de descanso, con dos dormitorios y un segundo ba\u00F1o completo.\\r\\n\\r\\nLa vivienda se entrega completamente amueblada y equipada, incluyendo electrodom\u00E9sticos, menaje, ropa de cama y toallas, adem\u00E1s de diferentes servicios asociados a la estancia.\\r\\n\\r\\nARRENDAMIENTO DE TEMPORADA\\r\\n\\r\\nLa vivienda se comercializa mediante contrato de arrendamiento para uso temporal, distinto de la residencia habitual y permanente del arrendatario.\\r\\n\\r\\nSer\u00E1 imprescindible acreditar una causa real, concreta y documentalmente justificable de temporalidad, que deber\u00E1 quedar expresamente identificada en el contrato.\\r\\n\\r\\nPodr\u00E1n valorarse, entre otros supuestos, desplazamientos profesionales o laborales, proyectos empresariales de duraci\u00F3n determinada, estudios, formaci\u00F3n u otras circunstancias temporales debidamente acreditadas.\\r\\n\\r\\nLa propiedad establece con car\u00E1cter general una duraci\u00F3n m\u00EDnima de entre 10 y 12 meses, con posibilidad de renovaci\u00F3n posterior seg\u00FAn acuerdo entre las partes.\\r\\n\\r\\nCONDICIONES ECON\u00D3MICAS\\r\\n\\r\\nRenta mensual: 4.950 \u20AC/mes, IVA incluido.\\r\\n\\r\\nPara la formalizaci\u00F3n del contrato se requerir\u00E1:\\r\\n\\r\\n 2 mensualidades de fianza.\\r\\n 2 mensualidades adicionales de garant\u00EDa.\\r\\n Primera mensualidad de renta.\\r\\n Acreditaci\u00F3n de solvencia econ\u00F3mica.\\r\\n Acreditaci\u00F3n documental de la causa de temporalidad.\\r\\n Sin honorarios de agencia para el arrendatario.\\r\\n\\r\\nLos suministros y consumos individualizables se abonar\u00E1n separadamente seg\u00FAn consumo.\\r\\n\\r\\nPlaza de aparcamiento opcional: 150 \u20AC/mes + IVA.\\r\\n\\r\\nSERVICIOS INCLUIDOS\\r\\n\\r\\n Vivienda completamente amueblada.\\r\\n WiFi.\\r\\n Limpieza semanal de aproximadamente 1,5 horas.\\r\\n Ropa de cama y toallas.\\r\\n Cambio de ropa de cama y toallas.\\r\\n Atenci\u00F3n y asistencia durante la estancia.\\r\\n Mantenimiento peri\u00F3dico de la piscina.\\r\\n Electrodom\u00E9sticos, peque\u00F1os electrodom\u00E9sticos y equipamiento necesario para entrar a vivir.\\r\\n\\r\\nUna opci\u00F3n especialmente indicada para profesionales desplazados, directivos, familias internacionales o personas que necesiten residir temporalmente en Barcelona por una causa debidamente acreditada.\\r\\n\\r\\nLa aceptaci\u00F3n de cualquier candidatura quedar\u00E1 sujeta al an\u00E1lisis de solvencia, a la acreditaci\u00F3n de la temporalidad y a la aprobaci\u00F3n final de la propiedad. \\r\\n#ref:AB2608002\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Sarri\u00E0 - Sant Gervasi\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{ a la c\u00FAspide del lujo, perfecto para quienes aprecian la m\u00E1s alta calidad, comodidad, privacidad y exclusividad.\\n\\nLa ubicaci\u00F3n de este apartamento es sencillamente inmejorable: a pocos pasos del mar, con f\u00E1cil acceso a la Ronda Litoral y excelentes conexiones de transporte p\u00FAblico, como metro, autobuses y tranv\u00EDas. Adem\u00E1s, est\u00E1 a solo un paso del centro comercial Diagonal Mar.\\n\\nSi busca un \u00E1tico de ensue\u00F1o frente al mar en Barcelona, esta exclusiva propiedad cumple con todas las expectativas.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Sant Mart\u00ED\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Paseo Paseo Taulat\",\"streetNumber\":\"256\"},\"coordinates\":{\"latitude\":41.406129608538684,\"longitude\":2.2171791892402553},\"displayAddressLine\":\"Paseo Paseo Taulat\",\"displayZoneLine\":\"Sant Mart\u00ED, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Diagonal Mar i el Front Mar\u00EDtim del Poblenou\",\"slug\":\"diagonal-mar-i-el-front-maritim-del-poblenou\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Sant Mart\u00ED\",\"slug\":\"sant-marti\"},{\"type\":\"street\",\"value\":\"Paseo de Garcia Faria\",\"slug\":\"paseo-de-garcia-faria\"}],\"geography\":[{\"level\":\"country\",\"code\":\"724\"},{\"level\":\"autonomous-community\",\"code\":\"9\"},{\"level\":\"province\",\"code\":\"8\"},{\"level\":\"region\",\"code\":\"232\"},{\"leve  lugares para cenar, tiendas esenciales y cosas que hacer, con f\u00E1cil acceso al transporte p\u00FAblico.\\n0 habitaciones en Studio con 1 ba\u00F1os.\\n\\nCaracter\u00EDsticas\\n     - Aire acondicionado\\n    - Calefacci\u00F3n central\\n    - Wifi\\n    - Microondas\\n    - Lavadora\\n    - Lavavajillas\\n\\nSOBRE UNIPLACES\\nTu Buscador de Hogares de Confianza\\nComo plataforma en l\u00EDnea pionera, Uniplaces conecta a individuos, ya sean estudiantes, profesionales o familias, con una amplia gama de alojamientos en alquiler. Nuestro compromiso va m\u00E1s all\u00E1 de las listas; verificamos cada propiedad para asegurarnos de que cumpla con nuestros estrictos criterios de comodidad y conveniencia. Elija Uniplaces para un viaje de alquiler suave, confiable y con una buena relaci\u00F3n calidad-precio.\",\"location\":{\"visibility\":\"ZONE\",\"municipality\":\"Barcelona Capital\",\"district\":\"Sants - Montju\u00EFc\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer de Sants\",\"streetNumber\":null},\"coordinates\":{\"latitude\":41.37645563597782,\"longitude\":2.125547156692619},\"displayAddressLine\":null,\"displayZoneLine\":\"Sants - Montju\u00EFc, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Sants-Badal\",\"slug\":\"sants-badal\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Sants - Montju\u00EFc\",\"slug\":\"sants-montjuic\"},{\"type\":\"street\",\"value\":\"Calle Jaume Roig\",\"slug\":\"calle-jaume-roig\"},{\"type\":\"street\ s\",\"summary\":{\"title\":\"Apartamento de 3 habitaciones en Eixample Esquerra\",\"description\":\"*COMPLETAMENTE AMUEBLADO*\\n*ALQUILERES TEMPORALES \u201CRENT TO RENT\u201D DE 1 A 11 MESES*\\n\\nEncuentra tu alojamiento en Barcelona con Costa, un piso de 95 m\u00B2 con 2 dormitorios dobles y 1 dormitorio individual, y 1 cuarto de ba\u00F1o con ducha. El apartamento cuenta con un balc\u00F3n.\\n\\nNada m\u00E1s entrar, te encontrar\u00E1s con un espacio luminoso y acogedor, dise\u00F1ado para que te sientas como en casa desde el primer d\u00EDa. Este apartamento cuenta con aire acondicionado en las habitaciones 1, 2 y 3. Adem\u00E1s, dispone de ascensor, acceso para movilidad reducida y acceso para mascotas. La decoraci\u00F3n est\u00E1 inspirada en un ambiente Playa.\\n\\nLa cocina est\u00E1 totalmente equipada con todos los utensilios y electrodom\u00E9sticos que necesitas, y se proporciona toda la ropa de cama y de ba\u00F1o.\\n\\nCertificado energ\u00E9tico: No. 7H78XZ9R3.\\n\\nLa estancia ofertada tiene una finalidad exclusivamente recreativa, vacacional o de ocio que deber\u00E1 acreditarse previamente y, por tanto, no queda sujeta al r\u00E9gimen de contenci\u00F3n de rentas. No obstante, dado que la vivienda se encuentra situada en una zona de mercado residencial tensionado y el art\u00EDculo 59 de la Ley 18/2007 exige incluir esta informaci\u00F3n en la publicidad de viviendas situadas en dichas zonas, se hace constar, a efectos meramente informativos, que el l\u00EDmite m\u00E1ximo aplicable conforme al sistema estatal de referencia de precios de alquiler amueblado es de 1257,47 \u20AC/mes.\\n\\n*Estancia m\u00EDnima de 31 noches, correspondiente a un per\u00EDodo superior a 32 d\u00EDas.\\n\\nUKIO SPAIN, S.L. tiene la condici\u00F3n legal de Gran Tenedor en Catalu\u00F1a.\\n\\n*El precio final puede variar seg\u00FAn la duraci\u00F3n de la estancia y la antelaci\u00F3n de la reserva. El precio del alquiler no incluye los eventuales servicios, suministro 2-8694-4c56-9a01-ca48e2d570c1\"}},{\"id\":\"75e81e10-d061-4b2b-8cc3-5683b778090c\",\"reference\":\"DOURO\",\"legacyNumericId\":\"31390000000607\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/apartamento/carrer-de-padilla/eixample/barcelona-capital/75e81e10-d061-4b2b-8cc3-5683b778090c/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/eixample/s\",\"summary\":{\"title\":\"Apartamento de dos dormitorios con terraza\",\"description\":\"*COMPLETAMENTE AMUEBLADO*\\n*ALQUILERES TEMPORALES \u201CRENT TO RENT\u201D DE 1 A 11 MESES*\\n\\nEncuentra tu alojamiento en Barcelona con Douro, un piso de 100 m\u00B2 con 2 dormitorios dobles y 2 cuartos de ba\u00F1o con ducha. Uno de los puntos fuertes del apartamento es su terraza de 15 m\u00B2.\\n\\nNada m\u00E1s entrar, te encontrar\u00E1s con un espacio luminoso y acogedor, dise\u00F1ado para que te sientas como en casa desde el primer d\u00EDa. Este apartamento cuenta con aire acondicionado en la habitaci\u00F3n 2. Adem\u00E1s, dispone de ascensor y acceso para mascotas. La decoraci\u00F3n est\u00E1 inspirada en un ambiente Sabana.\\n\\nLa cocina est\u00E1 totalmente equipada con todos los utensilios y electrodom\u00E9sticos que necesitas, y se proporciona toda la ropa de cama y de ba\u00F1o.\\n\\nCertificado energ\u00E9tico: No. BVXSP1FCB.\\n\\nLa estancia ofertada tiene una finalidad exclusivamente recreativa, vacacional o de ocio que deber\u00E1 acreditarse previamente y, por tanto, no queda sujeta al r\u00E9gimen de contenci\u00F3n de rentas. No obstante, dado que la vivienda se encuentra situada en una zona de mercado residencial tensionado y el art\u00EDculo 59 de la Ley 18/2007 exige incluir esta informaci\u00F3n en la publicidad de viviendas situadas en dichas zonas, se hace constar, a efectos meramente informativos, que el l\u00EDmite m\u00E1ximo aplicable conforme al sistema estatal de referencia de precios de alquiler amueblado es de 1230,13 \u20AC/mes.\\n\\n*Estancia m\u00EDnima de 31 noches, correspondiente a un per\u00EDodo superior a 32 d\u00EDas.\\n\\nUKIO SPAIN, S.L. tiene la condici\u00F3n legal de Gran Tenedor en Catalu\u00F1a.\\n\\n*El precio final puede variar seg\u00FAn la duraci\u00F3n de la estancia y la antelaci\u00F3n de la reserva. El precio del alquiler no incluye los eventuales servicios, suministros, limpieza, suplemento por mascota ni, en su caso, la fianza ni la garant\u00EDa adicional, que ser\u00E1n desglosados antes de la formalizaci\u00F3n del contrato final, una vez se haya concretado la duraci\u00F3n de la estancia y las restantes condiciones de la reserva.\\n\\n*El mobiliario y la decoraci\u00F3n pueden diferir ligeramente de las fotos debido a mantenimiento y mejoras de calidad por nuestro equipo de dise\u00F1o.\\n\\n*Para consultar precios actualizados, disponibilidad y todos los detalles del apartamento, visita nuestra web que encontrar\u00E1s al final de esta p\u00E1gina en \\\"ENLACE ADICIONAL\\\". Para cualquier duda, consulte con un agente de ventas.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Eixample\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer de Padilla\",\"streetNumber\":\"216\"},\"coordinates\":{\"latitude\":41.40457535244521,\"longitude\":2.1789460500014},\"displayAddressLine\":\"Carrer de Padilla\",\"displayZoneLine\":\"Eixample, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Sagrada Fam\u00EDlia\",\"slug\":\"sagrada-familia\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\" 0-d061-4b2b-8cc3-5683b778090c/d\",\"feature\":null,\"short\":\"/a/75e81e10-d061-4b2b-8cc3-5683b778090c\"}},{\"id\":\"243a4f3e-8aa7-4e58-89d3-94e48031aad5\",\"reference\":\"AB2604026-1\",\"legacyNumericId\":\"4737003827548\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/pl-de-llevant/sant-marti/barcelona-capital/243a4f3e-8aa7-4e58-89d3-94e48031aad5/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/sant-marti/s\",\"summary\":{\"title\":\"Piso en alquiler en Diagonal Mar\",\"description\":\"PISO CON VISTAS AL MAR AMUEBLADO DE OBRA NUEVA \\n\\nEste piso de obra nueva totalmente amueblado de 95 m2 se encuentra en la zona de Diagonal Mar, un barrio muy comercial, muy cercano a la zona de playas y al barrio Poble Nou, rodeado de todo tipo de servicios y que tiene a su alcance varias opciones de transporte p\u00FAblico.\\n\\nEn la zona de d\u00EDa, nos encontramos con un amplio sal\u00F3n comedor con cocina integrada totalmente equipada con electrodom\u00E9sticos de Miele. A continuaci\u00F3n encontramos un ventanal de cristal con salida a una agradable y disfrutable terraza con vistas al mar. \\n\\nLa zona de noche consta una amplia y luminosa habitaci\u00F3n doble en suite con ba\u00F1era de dise\u00F1o y ducha de cliente separados por mamparas de cristal y con salida directa tambi\u00E9n a la terraza.\\n\\nEl piso cuenta con sistema dom\u00F3tico con pantalla de control y acabados de calidad de dise\u00F1o exclusivo, suelos de madera y una decoraci\u00F3n donde se han cuidado todos los detalles para crear un espacio relajante y confortable.\\n\\nEl edificio cuenta con un servicio de conserjer\u00EDa las 24/7, un gimnasio de 1000 m2 con piscina cubierta climatizada, spa con jacuzzi, sauna y una terraza con sol\u00E1rium, pista de p\u00E1del, una piscina infinity y un impresionante 360\u00BA de toda la ciudad.\\n\\nEn el precio se incluye una plaza de parking en la misma finca.\\n\\nDisponibilidad a partir del 27 de abril 2026, ideal para parejas, ejecutivo y familias.\\n\\nLa finalidad del contrato es temporal. \\n\\nHonorarios de agencia a cargo del propietario.   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\n Ref. AB2604026-1\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB05575523***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Sant Mart\u00ED\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Pl. de Llevant\",\"streetNumber\":\"1\"},\"coordinates\":{\"latitude\":41.41208862902596,\"longitude\":2.2194763809785627},\"displayAddressLine\":\"Pl. de Llevant\",\"displayZoneLine\":\"Sant Mart\u00ED, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"El Bes\u00F3s i el Maresme\",\"slug\":\"el-besos-i-el-maresme\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Sant Mart\u00ED\",\"slug\":\"sant-marti\"},{\"type\":\"street\",\"value\":\"Rambla Prim\",\"slug\":\"rambla-prim\"},{\"type\":\"stre al/ciutat-vella/s\",\"summary\":{\"title\":\"Piso en alquiler en El G\u00F3tico\",\"description\":\"PISOS DE LUJO EN ALQUILER\\n\\n\u00A1DISPONIBILIDAD INMEDIATA!\\n\\nEl Palacio Mox\u00F3, situado en la Plaza Sant Just del Barrio G\u00F3tico de Barcelona, ha sido sometido a una ambiciosa rehabilitaci\u00F3n que combina la conservaci\u00F3n de su riqueza hist\u00F3rica con una modernizaci\u00F3n excepcional, convirti\u00E9ndolo en un exclusivo conjunto de apartamentos de lujo. Este proyecto ha preservado cuidadosamente elementos arquitect\u00F3nicos originales, como los frescos restaurados, techos altos y molduras decorativas del siglo XVIII, integr\u00E1ndolos con caracter\u00EDsticas contempor\u00E1neas que garantizan un confort y elegancia incomparables.\\n\\nEl edificio ha sido rehabilitado de manera integral, lo que le permite ofrecer una experiencia \u00FAnica que fusiona lo mejor de la historia y la modernidad. Los apartamentos, disponibles en configuraciones de dos y tres habitaciones, destacan por sus amplios espacios y cuentan con una terraza privada exclusiva para cada uno, proporcionando un rinc\u00F3n \u00FAnico para disfrutar del aire libre en pleno coraz\u00F3n de la ciudad.\\n\\nAdem\u00E1s de su encanto arquitect\u00F3nico, el palacio ofrece una amplia gama de instalaciones exclusivas, como una piscina privada ideal para el descanso, un gimnasio completamente equipado que permite mantener un estilo de vida saludable y un moderno espacio de coworking con wifi de alta velocidad, perfecto para quienes necesitan un entorno profesional y sofisticado.\\n\\nEl alquiler de los apartamentos incluye servicios dise\u00F1ados para brindar una experiencia c\u00F3moda y sin preocupaciones. Estos servicios abarcan limpieza una vez por semana, con cambio de s\u00E1banas y toallas, as\u00ED como luz, agua, aire acondicionado (AACC), calefacci\u00F3n, TV SAT y conexi\u00F3n a internet de alta velocidad, tanto en el apartamento como en toda la finca. Asimismo, el edificio dispone de un servicio de conserjer\u00EDa para atender cualquier necesidad de los residentes.\\n\\nEn definitiva, la rehabilitaci\u00F3n del Palacio Mox\u00F3 no solo preserva su valioso legado patrimonial, sino que lo transforma en un s\u00EDmbolo de sofisticaci\u00F3n moderna en el coraz\u00F3n de Barcelona. Con su combinaci\u00F3n \u00FAnica de historia, lujo, servicios exclusivos y espacios modernos, ofrece un entorno excepcional para aquellos que buscan vivir en un espacio que a\u00FAna car\u00E1cter hist\u00F3rico, comodidad contempor\u00E1nea y un estilo de vida elegante.\\n\\nLa finalidad del contrato es temporal.\\n\\nLa realidad del mobiliario puede no corresponder exactamente con las fotograf\u00EDas mostradas en este anuncio.\\n\\n   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2505091-1\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB04763323***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Ciutat Vella\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Pla\u00E7a de Sant Just\",\"streetNumber\":\"4\"},\"coordinates\":{\"latitude\":41.38332182919192,\"longitude\":2.1785053272629966},\"displayAddressLine\":\" s\":\"AVAILABLE\"}},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":9900,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"leadsapbcn@aproperties.es\",\"phone\":\"+34930191968\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/placa-de-sant-just/ciutat-vella/barcelona-capital/25d08f1f-fa12-48f4-b94f-6aa52a19ab4e/d\",\"feature\":null,\"short\":\"/a/25d08f1f-fa12-48f4-b94f-6aa52a19ab4e\"}},{\"id\":\"32c1497d-5a38-47f0-b383-8db15f5b3bef\",\"reference\":\"AB2606011\",\"legacyNumericId\":\"4737003821323\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/c-de-girona/eixample/barcelona-capital/32c1497d-5a38-47f0-b383-8db15f5b3bef/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/eixample/s\",\"summary\":{\"title\":\"Piso en alquiler en calle Girona\",\"description\":\"PISO DE LUJO DE 3 HABITACIONES AMUEBLADO CON PISCINA Y GIMNASIO EN EL EIXAMPLE DERECHA \\n\\nUbicado en l`Eixample Dreta, rodeado de comercios, restaurantes y museos, muy cerca de Passeig de Gr\u00E0cia y Pla\u00E7a Catalunya, encontramos este apartamento modernista catalogado de principios de Siglo, en una elegante finca dise\u00F1ada por Eric Sagnier, un conocido arquitecto modernista.\\n\\nEsta prestigiosa finca modernista ofrece prestaciones exclusivas a sus residentes, como un jard\u00EDn con piscina en la azotea, donde tomar el sol y ba\u00F1arse disfrutando de preciosas vistas a Barcelona, y un gimnasio con piscina en la planta baja, perfecto para practicar deporte a cualquier hora. Los amantes del vino encontraran en la bodega subterr\u00E1nea, dise\u00F1ada para almacenar y preservar tus mejores a\u00F1adas en condiciones \u00F3ptimas.\\n\\nEs un exclusivo piso de 193 m\u00B2 con acabados de alta gama y con espacios amplios y luminosos.\\n\\nLa zona de d\u00EDa y de noche est\u00E1n muy bien diferenciadas. En la zona de d\u00EDa, encontramos un amplio sal\u00F3n-comedor con dos balcones, y una amplia cocina semiabierta de la marca Bulthaup con electrodeom\u00E9sticos de alta gama Gaggenau.\\n\\nEn la zona de noche, encontramos tres amplios dormitorios; uno de ellos con ba\u00F1o privado, todos con acceso a una agradable galer\u00EDa. Completan este excelente piso dos ba\u00F1os completos y un aseo de cortes\u00EDa. El inmueble dispone de parqu\u00E9, calefacci\u00F3n, aire acondicionado, techos altos y molduras.\\n\\nDispone de servicio de vigilancia y conserjer\u00EDa 24h, 365 d\u00EDas al a\u00F1o, se encargar\u00E1n de atender tus necesidades y garantizar tu bienestar.\\n\\nEn el proyecto de rehabilitaci\u00F3n de la finca se han conservado todos los detalles decorativos catalogados, manteniendo todas las caracter\u00EDsticas arquitect\u00F3nicas de la \u00E9poca modernista: la luz, el espacio, la habitabilidad y la calidad de los materiales.\\n\\nEn cumplimiento de la Ley 12/2023 y la Liei 18/2007 informamos que: \u00CDndice de R.P.LL: 112,05 \u20AC / m2 Respecto a la presente propiedad no existe certificado informativo estatal de referencia de precios en alquiler. Este propietario ostenta la condici\u00F3n de gran tenedor. La presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello de conformidad a la LAU no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n\\n   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 12,02 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice es e permite ofrecer una experiencia \u00FAnica que fusiona lo mejor de la historia y la modernidad. Los apartamentos, disponibles en configuraciones de dos y tres habitaciones, destacan por sus amplios espacios y cuentan con una terraza privada exclusiva para cada uno, proporcionando un rinc\u00F3n \u00FAnico para disfrutar del aire libre en pleno coraz\u00F3n de la ciudad.\\n\\nAdem\u00E1s de su encanto arquitect\u00F3nico, el palacio ofrece una amplia gama de instalaciones exclusivas, como una piscina privada ideal para el descanso, un gimnasio completamente equipado que permite mantener un estilo de vida saludable y un moderno espacio de coworking con wifi de alta velocidad, perfecto para quienes necesitan un entorno profesional y sofisticado.\\n\\nEl alquiler de los apartamentos incluye servicios dise\u00F1ados para brindar una experiencia c\u00F3moda y sin preocupaciones. Estos servicios abarcan limpieza una vez por semana, con cambio de s\u00E1banas y toallas, as\u00ED como luz, agua, aire acondicionado (AACC), calefacci\u00F3n, TV SAT y conexi\u00F3n a internet de alta velocidad, tanto en el apartamento como en toda la finca. Asimismo, el edificio dispone de un servicio de conserjer\u00EDa para atender cualquier necesidad de los residentes.\\n\\nEn definitiva, la rehabilitaci\u00F3n del Palacio Mox\u00F3 no solo preserva su valioso legado patrimonial, sino que lo transforma en un s\u00EDmbolo de sofisticaci\u00F3n moderna en el coraz\u00F3n de Barcelona. Con su combinaci\u00F3n \u00FAnica de historia, lujo, servicios exclusivos y espacios modernos, ofrece un entorno excepcional para aquellos que buscan vivir en un espacio que a\u00FAna car\u00E1cter hist\u00F3rico, comodidad contempor\u00E1nea y un estilo de vida elegante.\\n\\nLa finalidad del contrato es temporal.\\n\\nLa realidad del mobiliario puede no corresponder exactamente con las fotograf\u00EDas mostradas en este anuncio.\\n\\nHonorarios de agencia a cargo del propietario.  \\n* En cumplimiento de la s\":{\"canonical\":\"/alquiler/planta-intermedia/placa-de-sant-just/ciutat-vella/barcelona-capital/65d1fe0e-9989-4078-b2d4-3dc119476353/d\",\"feature\":null,\"short\":\"/a/65d1fe0e-9989-4078-b2d4-3dc119476353\"}},{\"id\":\"7045723f-9388-457b-aa70-a3b8bdb8e8ed\",\"reference\":\"AB2501020\",\"legacyNumericId\":\"4737003823521\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/carrer-d-ausias-marc/eixample/barcelona-capital/7045723f-9388-457b-aa70-a3b8bdb8e8ed/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/eixample/s\",\"summary\":{\"title\":\"D\u00FAplex en alquiler en Calle Ausi\u00E0s Marc, Barcelona\",\"description\":\"D\u00DAPLEX EN ALQUILER, DE 4 HABITACIONES, AMUEBLADO Y REFORMADO, EN EIXAMPLE DRETA\\n\\nEn pleno Eixample Dreta de Barcelona, a pocos pasos de Passeig de Gr\u00E0cia y Pla\u00E7a Catalunya, se encuentra este exclusivo d\u00FAplex de lujo ubicado en la emblem\u00E1tica Casa Bur\u00E9s, una de las joyas modernistas mejor conservadas de la ciudad. La rehabilitaci\u00F3n integral del edificio ha respetado su esencia hist\u00F3rica mientras incorpora todas las comodidades contempor\u00E1neas, convirti\u00E9ndolo en una oportunidad \u00FAnica para quienes buscan una vivienda singular en el coraz\u00F3n de Barcelona.\\n\\nLa propiedad destaca por sus amplios espacios, techos altos con molduras originales, pinturas decorativas restauradas y espectaculares suelos hidr\u00E1ulicos. En la planta principal encontramos un gran sal\u00F3n-comedor con cocina abierta, muy luminoso y con salida a tres balcones, adem\u00E1s de una habitaci\u00F3n doble esquinera tambi\u00E9n con acceso exterior, una habitaci\u00F3n individual con ba\u00F1o privado y una zona de lavander\u00EDa. La planta superior alberga dos habitaciones dobles adicionales, ambas en suite, una de ellas con zona de despacho, armarios empotrados y acceso directo a una agradable terraza privada.\\n\\nEste d\u00FAplex es ideal para quienes valoran la arquitectura hist\u00F3rica, la exclusividad y un estilo de vida urbano sofisticado. Vivir en Casa Bur\u00E9s significa disfrutar de servicios excepcionales como piscina interior climatizada, gimnasio, home cinema, espacios de trabajo, bodega, cocina profesional para eventos y una espectacular piscina exterior en la azotea con zona de sol\u00E1rium.\\n\\nUna residencia irrepetible para disfrutar de la Barcelona m\u00E1s aut\u00E9ntica desde un edificio ic\u00F3nico. Descubra con aProperties Real Estate todos los detalles de esta extraordinaria propiedad en alquiler en Eixample Dreta.  \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nRenta del \u00FAltimo contrato de arrendamiento: 18.000,00 \u20AC\\nEste propietario no ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2501020\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB00042319***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Eixample\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer d'Ausi\u00E0s Marc\",\"streetNumber\":\"30\"},\"coordinates\":{\"latitude\":41.3942711877499,\"longitude\":2.1790849136209545},\"displayAddressLine\":\"Carrer d'Ausi\u00E0s Marc\",\"displayZoneLine\":\"Eixample, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Fort Pienc\",\"slug\":\"fort-pienc\"},{\"t 45723f-9388-457b-aa70-a3b8bdb8e8ed\"}},{\"id\":\"7e4daa9c-e7ba-4af9-acda-dd0618961e84\",\"reference\":\"AB2610012\",\"legacyNumericId\":\"4737003828752\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/sarria-sant-gervasi/barcelona-capital/7e4daa9c-e7ba-4af9-acda-dd0618961e84/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/sarria-sant-gervasi/s\",\"summary\":{\"title\":\"Casa en alquiler en la calle Angli\",\"description\":\"ESPECTACULAR CASA PARA RESIDENCIA HABITUAL\\n\\nPreciosa casa de lujo de car\u00E1cter Suntuaria con una superficie de 310 m\u00B2, Situada en el barrio de Sarri\u00E0, en Les Tres Torres, con todo tipo de servicios, cerca de colegios nacionales e internacionales y al lado de la parada de Sarri\u00E0 de los FCC\\n\\nEsta casa de dos plantas ofrece un espacio amplio y c\u00F3modo para toda la familia.\\n\\nSe entra a la vivienda por un espacioso recibidor proporcionando acceso a las diferentes \u00E1reas de la casa; En la parte posterior, encontramos una amplia cocina de dise\u00F1o, completamente equipada con electrodom\u00E9sticos de \u00FAltima gama. Desde la cocina se accede a la zona de servicio, formada por el lavadero, la habitaci\u00F3n de servicio, un ba\u00F1o completo y dos peque\u00F1os patios.\\n\\nA la izquierda del recibidor, accedemos al espacioso sal\u00F3n con vistas al jard\u00EDn a trav\u00E9s de tres grandes ventanales. Junto a esta estancia, se encuentra el comedor, con una mesa de gran capacidad, perfecta para recibir hasta 12 invitados y un ba\u00F1o completo.\\n\\nDesde el recibidor, se accede al segundo piso a trav\u00E9s de unas escaleras de madera, donde se encuentra la zona de noche con 3 grandes habitaciones, la suite principal, que cuenta con su propio acceso al balc\u00F3n, un amplio vestidor y un ba\u00F1o completo en suite y dos habitaciones dobles y exteriores que comparten un ba\u00F1o completo. Todas las habitaciones tienen acceso a un balc\u00F3n o terraza.\\n\\nCaracter\u00EDsticas principales:\\n\\nSuperficie: 280 m\u00B2\\nJard\u00EDn: 120 m\u00B2, con zona de comedor exterior con capacidad para 12 comensales.\\nHabitaciones: 4, tres en la planta superior y una en PB.\\nBa\u00F1os: 4 (dos en planta superior y dos en PB, todos completos).\\nVestidor: la Suite principal cuenta con un amplio vestidor.\\nCocina: Cocina plenamente equipada con electrodom\u00E9sticos de primeras marcas y con zona office con capacidad para 6 personas.\\nSal\u00F3n y Comedor: Amplios y luminosos, con acceso directo al jard\u00EDn.\\nBiblioteca/Sala de juegos: Espacio di\u00E1fano y vers\u00E1til para tus necesidades, conectado con el sal\u00F3n y comedor.\\nBodega: Espacio dise\u00F1ado para almacenar m\u00E1s de 100 botellas de vino.\\nZona de Lavadero: Pr\u00E1ctica y funcional, con acceso a un patio exterior para tender.\\nHabitaci\u00F3n y Ba\u00F1o de Servicio: Ideal para alojar personal dom\u00E9stico.\\nAmplia terraza y Balc\u00F3n: Espacios exteriores para disfrutar del clima de Barcelona. Salida desde las tres habitaciones de la planta 1.\\nGaraje Propio: Espacio para estacionar tu veh\u00EDculo con comodidad en la propia finca. Acceso peatonal desde el jard\u00EDn.\\nTrastero: \u00C1rea adicional para almacenamiento.\\nSistema de climatizaci\u00F3n: Aire acondicionado fr\u00EDo/calor, suelo radiante generado con aerotermia.\\nSistema audio: Sonos, instalado en el techo de toda la propiedad, as\u00ED como en la zona del jard\u00EDn.  \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 21,28 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nRenta del \u00FAltimo contrato de arrendamiento: 7.000,00 \u20AC\\nEste propietario no ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2610012\\n\\nN\u00BA AICAT: 8446\",\"location\":{\"visibility\":\"ZONE\",\"municipality\":\"Barcelona Capital\",\"district\":\"Sarri\u00E0 - Sant Gervasi\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer d'Angl\u00ED\",\"streetNumber\":\"9\"},\"coordinates\":{\"latitude\":41.404097412727836,\"longitude\":2.1227119456157197},\"displayAddressLine\":null,\"displayZoneLine\":\"Sarri\u00E0 - Sant Gervasi, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Sarri\u00E0\",\"slug\":\"sarria\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Sarri\u00E0 - Sant Gervasi\",\"slug\":\"sarria-sant-gervasi\"},{\"type\":\"street\",\"value\":\"Calle Carrasco i Formiguera\",\"slug\":\"calle-carrasco-i-formiguera\"},{\"type\":\"street\",\"value\":\"Calle Margenat\",\"slug\":\"calle-margenat\"},{\"type\":\"street\",\"value\":\"Calle Dolors Monserda\",\"slug\":\"calle-dolors-monserda\"},{\"type\":\"street\",\"value\":\"Calle Angli\",\"slug\":\"calle-angli\"}],\"geography\":[{\"level\":\"country\",\"code\":\"724\"},{\"level\":\"autonomous-community\",\"code\":\"9\"},{\"level\":\"province\",\"code\":\"8\"},{\"level\":\"region\",\"code\":\"232\"},{\"level\":\"area\",\"code\":\"376\"},{\"level\":\"municipality\",\"code\":\"8019\"},{\"level\":\"district\",\"code\":\"1143\"},{\"level\":\"neighbourhood\",\"code\":\"286\"}]},\"multimedia\":{\"images\":[{\"type\":null ropertyType\":\"flat\",\"propertySubtype\":\"flat\",\"status\":null,\"rooms\":4,\"bathrooms\":3,\"builtSurface\":217,\"landArea\":null,\"constructionYear\":1936,\"terrace\":{\"surface\":120,\"has\":true},\"floor\":null,\"features\":{\"has\":[\"FURNISHED\",\"AIR_CONDITIONER\",\"LAUNDRY\",\"WARDROBES\",\"HOME_APPLIANCES\",\"BALCONY\",\"PETS_ALLOWED\",\"SUITE_BATHROOM\",\"EQUIPPED_KITCHEN\",\"PRIVATE_GARDEN\",\"PRIVATE_PARKING\"],\"hasNot\":[\"STORAGE_ROOM\",\"DOORMAN\",\"GYM\",\"DRYER\",\"ELEVATOR\",\"COMMUNITY_POOL\"]},\"orientation\":\"EAST\",\"heating\":\"ELECTRIC\",\"hotWater\":\"ELECTRIC\",\"energyEfficiencyCertificate\":{\"data\":{\"consumption\":{\"label\":\"C\",\"value\":87},\"emissions\":{\"label\":\"C\",\"value\":14}},\"status\":\"AVAILABLE\"},\"dynamicFeatures\":[\"IS_SINGLE_FAMILY_HOME\",\"IS_VILLA\",\"IS_EXTERIOR\",\"IS_CLOSE_TO_SNOW\"]},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":7285,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"leadsapbcn@aproperties.es\",\"phone\":\"+34930191966\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/sarria-sant-gervasi/barcelona-capital/7e4daa9c-e7ba-4af9-acda-dd0618961e84/d\",\"feature\":null,\"short\":\"/a/7e4daa9c-e7ba-4af9-acda-dd0618961e84\"}},{\"id\":\"89735775-f07f-432a-84aa-ca3b5c210a0c\",\"reference\":\"AB2603055\",\"legacyNumericId\":\"4737003827435\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/carrer-de-valencia/eixample/barcelona-capital/89735775-f07f-432a-84aa-ca3b5c210a0c/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/eixample/s\",\"summary\":{\"title\":\"Piso en alquiler en Calle Valencia\",\"description\":\"\u00C1TICO DE LUJO A CUATRO VIENTOS EN ALQUILER DE CINCO HABITACIONES CON BA\u00D1O EN SUITE EN CALLE VALENCIA \\n\\nImpresionante \u00E1tico de 345 m\u00B2 situado en una de las ubicaciones m\u00E1s privilegiadas de Barcelona, en Calle Valencia junto a Paseo de Gracia. Una propiedad \u00FAnica a cuatro vientos, completamente exterior, que combina dise\u00F1o contempor\u00E1neo, luz natural y absoluta privacidad.\\n\\nLa vivienda destaca por su arquitectura moderna y elegante, con una distribuci\u00F3n fluida donde los espacios se conectan a trav\u00E9s de amplios ventanales y zonas acristaladas que aportan una luminosidad excepcional durante todo el d\u00EDa.\\n\\nEl acceso ya marca la diferencia, con un sofisticado recibidor y un espectacular pasillo acristalado con vegetaci\u00F3n que aporta un efecto visual \u00FAnico y una sensaci\u00F3n de calma en pleno centro urbano.\\n\\nLa zona de d\u00EDa ofrece un amplio sal\u00F3n-comedor de dise\u00F1o, con acabados de alta gama, panelados de madera natural y grandes aperturas al exterior. Un espacio pensado tanto para el confort diario como para recibir invitados en un entorno exclusivo. La cocina, abierta al espacio, est\u00E1 equipada con electrodom\u00E9sticos de \u00FAltima gama. \\n\\nLa propiedad dispone de vistas abiertas y una conexi\u00F3n constante con el exterior.\\n\\nLa zona de noche se compone de cinco habitaciones, todas ellas con ba\u00F1o en suite y con un nivel de acabados acorde al resto de la vivienda, ideal para uso familiar.\\n\\nEntre sus caracter\u00EDsticas destaca el dise\u00F1o arquitect\u00F3nico contempor\u00E1neo, las grandes superficies acristaladas y los materiales de alta calidad. Tambi\u00E9n cuenta con acceso a una terraza en el \u00E1tico de 200m2 con unas impresionantes vistas panor\u00E1micas a la ciudad.\\n\\nUbicado en el coraz\u00F3n del Eixample, rodeado de las mejores boutiques, restaurantes y servicios de la ciudad, con excelentes conexiones.\\n\\nUna pieza \u00FAnica en el mercado de alquiler de Barcelona, ideal para quienes buscan exclusividad, amplitud y dise\u00F1o en una ubicaci\u00F3n inmejorable.  \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 19,57 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2603055\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB05321518***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Eixample\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer de Val\u00E8ncia\",\"streetNumber\":\"247\"},\"coordinates\":{\"latitude\":41.39298013091834,\"longitude\":2.1629409795563106},\"displayAddressLine\":\"Carrer de Val\u00E8ncia\",\"displayZoneLine\":\"Eixample, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Dreta de l'Eixample\",\"slug\":\"dreta-de-l-eixample\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Eixample\",\"slug\":\"eixample\"},{\"type\":\"street\",\"value\":\"Paseo Gracia\",\"slug\":\"paseo-gracia\"},{\"type\":\"street\",\"value\":\"Pasaje Domingo\",\"slug\" "/alquiler/viviendas/barcelona-provincia/barcelona-capital/ciutat-vella/s\",\"summary\":{\"title\":\"Loft en alquiler en el Born\",\"description\":\"LOFT EN ALQUILER, AMUEBLADO, EN PASAJE PRIVATIVO DEL BORN\\n\\nEn pleno barrio de El Born, a pocos pasos de Plaza Catalunya, el Arc de Triomf y algunas de las mejores propuestas gastron\u00F3micas, culturales y comerciales de Barcelona, encontramos este exclusivo loft de 300 m\u00B2 ubicado en un pasaje privado que aporta tranquilidad y privacidad en una de las zonas m\u00E1s din\u00E1micas de la ciudad. Se trata de una vivienda completamente amueblada que combina la personalidad de la arquitectura industrial con un dise\u00F1o contempor\u00E1neo de alto nivel, ideal para quienes buscan amplitud, car\u00E1cter y una ubicaci\u00F3n verdaderamente privilegiada.\\n\\nEl interior destaca por sus generosos espacios abiertos y una extraordinaria entrada de luz natural gracias a sus grandes ventanales. Los techos abovedados, las vigas de hierro vistas y las paredes de obra original aportan autenticidad y sofisticaci\u00F3n. La propiedad dispone de dos amplios salones diferenciados, uno concebido como zona de relax y otro perfecto para recibir invitados, adem\u00E1s de una cocina americana de dise\u00F1o totalmente equipada con electrodom\u00E9sticos premium. La zona de noche alberga dos elegantes suites con una de ellas con vestidor integrado y amplios ba\u00F1os con acabados de alta calidad. Cuenta tambi\u00E9n con aire acondicionado y calefacci\u00F3n por conductos, ascensor y servicio de conserjer\u00EDa.\\n\\nVivir en El Born significa disfrutar de un estilo de vida urbano y cosmopolita, rodeado de galer\u00EDas de arte, plazas hist\u00F3ricas, restaurantes con encanto y espacios culturales emblem\u00E1ticos. Todo ello con excelentes conexiones de transporte p\u00FAblico y acceso r\u00E1pido a los principales puntos de la ciudad.\\n\\nUna propiedad singular para quienes valoran el dise\u00F1o, el espacio y la experiencia d s\":\"AVAILABLE\"}},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":7500,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"leadsapbcn@aproperties.es\",\"phone\":\"+34930191966\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/passatge-sert/ciutat-vella/barcelona-capital/8bfd71f0-a285-4d4e-86c9-e69eb1acf41c/d\",\"feature\":null,\"short\":\"/a/8bfd71f0-a285-4d4e-86c9-e69eb1acf41c\"}},{\"id\":\"937d276b-92d1-4413-86cc-3fafb4160b2f\",\"reference\":\"AB2512065\",\"legacyNumericId\":\"4737003826861\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/carrer-de-freixa/sarria-sant-gervasi/barcelona-capital/937d276b-92d1-4413-86cc-3fafb4160b2f/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/sarria-sant-gervasi/s\",\"summary\":{\"title\":\"\u00C1tico en alquiler en Sant Gervasi\",\"description\":\"\u00C1TICO D\u00DAPLEX SEMIAMUEBLADO DE TRES DORMITORIOS EN SUITE CON TERRAZA Y PARKING \\n\\nEste precioso piso familiar de 375m2 con orientaci\u00F3n a tres vientos y una enorme terraza se encuentra en la prestigiosa zona de Sant Gervasi, en la calle Freixa. Es perfectamente adecuado para quienes disfrutan de pasear y tener todo al alcance de la mano, adem\u00E1s de excelentes conexiones de transporte p\u00FAblico.\\n\\nAl entrar encontramos un c\u00E1lido recibidor que nos da paso a la zona de d\u00EDa, un amplio y luminoso espacio que se divide en tres ambientes, incluyendo comedor, sal\u00F3n y una habitaci\u00F3n que se puede cerrar con puertas correderas y se puede utilizar desde biblioteca o sal\u00F3n para la televisi\u00F3n. \\n\\nDesde el sal\u00F3n, se accede a una espaciosa y soleada terraza orientada al suroeste.\\n\\nA trav\u00E9s del comedor se accede a la cocina, exterior, con mucho espacio de almacenaje y electrodom\u00E9sticos de alta gama: nevera de dos puertas, microondas, horno, nevera de vinos integrada y sistema de osmosis.   \\nDesde la cocina entramos a la zona de servicio que cuenta con una habitaci\u00F3n destinada a la zona de lavander\u00EDa y una zona de aguas con acceso a un ba\u00F1o completo. \\n\\nLa zona de noche se compone por tres habitaciones en suite. La suite principal, exterior, cuenta con un gran vestidor, un ba\u00F1o completo con dos lavamanos y la zona del dormitorio que tiene dos ventanas con acceso a peque\u00F1os balcones. La segunda habitaci\u00F3n es una habitaci\u00F3n doble con escritorio y con ba\u00F1o en suite y la tercera habitaci\u00F3n es individual tambi\u00E9n con ba\u00F1o en suite con ba\u00F1era.\\n\\nAl acceder a la segunda planta encontramos un despacho abierto y una habitaci\u00F3n que se puede destinar a despacho o a sala de cine. El piso superior tambi\u00E9n cuenta con un ba\u00F1o completo. Desde la segunda planta se accede a la gran terraza en forma de U que tiene unas impresionantes vistas, jardineras, bancos y suelo de teca. \\n\\nEl suelo de la vivienda es de parquet, aire acondicionado por conductos en todas las \u00E1reas de la casa, calefacci\u00F3n por gas mediante radiadores.\\nLa vivienda dispone de tres plazas de aparcamiento en la misma finca, una de ellas con cargador para coche el\u00E9ctrico y una peque\u00F1a habitaci\u00F3n que podr\u00EDa utilizarse como trastero. \\n\\nServicio de conserjer\u00EDa, as\u00ED como un ascensor y un montacargas. \\n\\nEste piso representa una oportunidad excepcional para vivir en una de las zonas m\u00E1s deseables de Sant Gervasi. \u00A1Cont\u00E1ctanos para obtener m\u00E1s informaci\u00F3n y programar una visita!  \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 20,57 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2512065\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB04184421***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Sarri\u00E0 - Sant Gervasi\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Carrer de Freixa\",\"streetNumber\":\"31-35\"},\"coordinates\":{\"latitude\":41.39915939357505,\"longitude\":2.1385107643071706},\"displayAddressLine\":\"Carrer de Freixa\",\"displayZoneLine\":\"Sarri\u00E0 - Sant Gervasi, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Sant Gervasi- Galvany\",\"slug\":\"sant-gervasi-galvany\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Sarri\u00E0 - Sant Gervasi\",\"slug\":\"sarria-sant-gervasi\"},{\"type\":\"street\",\"value\":\"Calle Copernic\",\"slug\":\"calle-copernic\"},{\"type\":\"street\",\"value\":\"Calle Vallmajor\",\"slug\":\"calle-vallmajor\"},{\"type\":\"street\",\"value\":\"Calle Freixa\",\"slug\":\"calle-freixa\"},{\"type\":\"street\",\"value\":\"Calle Modolell\",\"slug\":\"calle-modolell\"},{\"type\":\"street\",\" "status\":null,\"rooms\":3,\"bathrooms\":5,\"builtSurface\":375,\"landArea\":null,\"constructionYear\":1993,\"floor\":\"FOURTH\",\"features\":{\"has\":[\"STORAGE_ROOM\",\"FURNISHED\",\"AIR_CONDITIONER\",\"LAUNDRY\",\"WARDROBES\",\"HOME_APPLIANCES\",\"BALCONY\",\"DOORMAN\",\"SUITE_BATHROOM\",\"EQUIPPED_KITCHEN\",\"ELEVATOR\",\"PRIVATE_PARKING\"],\"hasNot\":[\"GYM\",\"PETS_ALLOWED\",\"DRYER\",\"PRIVATE_GARDEN\",\"COMMUNITY_POOL\"]},\"orientation\":\"NORTH\",\"heating\":\"NATURAL_GAS\",\"hotWater\":\"NATURAL_GAS\",\"energyEfficiencyCertificate\":{\"data\":{\"consumption\":{\"label\":\"E\",\"value\":156},\"emissions\":{\"label\":\"E\",\"value\":32}},\"status\":\"AVAILABLE\"}},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":8300,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"leadsapbcn@aproperties.es\",\"phone\":\"+34930191968\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/carrer-de-freixa/sarria-sant-gervasi/barcelona-capital/937d276b-92d1-4413-86cc-3fafb4160b2f/d\",\"feature\":null,\"short\":\"/a/937d276b-92d1-4413-86cc-3fafb4160b2f\"}},{\"id\":\"ad918d75-2c7e-4ed3-a34f-1d743fbb5ea9\",\"reference\":\"AB2406026-1\",\"legacyNumericId\":\"4737003821650\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/trav-de-dalt/gracia/barcelona-capital/ad918d75-2c7e-4ed3-a34f-1d743fbb5ea9/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/gracia/s\",\"summary\":{\"title\":\"Piso en alquiler en Gr\u00E0cia\",\"description\":\"\u00C1TICO EN ALQUILER, AMUEBLADO, DE 3 HABITACIONES\\n\\nNos encontramos en la zona alta del barrio de Gr\u00E0cia, en frente al parque Jardins de Men\u00E9ndez i Pelayo y a tan solo 500 metros del Park G\u00FCell, con un magn\u00EDfico \u00E1tico de lujo con unas vistas espectaculares a toda la ciudad.\\n\\nEl \u00E1tico consta de una superficie aproximada de 190m2 y de una terraza de 45m2.\\n\\nLa vivienda ha sido decorada por el reconocido estudio WIT Design Barcelona.\\n\\nEn la zona de d\u00EDa nos encontramos con un amplio sal\u00F3n comedor con salida a una gran terraza y con vistas espectaculares a toda la ciudad; una cocina de dise\u00F1o abierta equipada con todos los electrodom\u00E9sticos necesarios de alta gama hasta incluso el peque\u00F1o menaje. La zona de noche est\u00E1 muy bien diferenciada de la zona de d\u00EDa y consta de 3 habitaciones dobles: una de ellas en suite, otra habitaci\u00F3n doble con una acogedora terraza, ambas con vistas, y una tercera habitaci\u00F3n que pueda utilizarse tambi\u00E9n como despacho.\\n\\nEl edificio dispone de una terraza rooftop con mesas, tumbonas y chill-out, gimnasio y parking para bicicletas y patinetes.\\n\\nLa vivienda dispone de una serie de servicios incluidos en el alquiler: suministros (agua, electricidad y WIFI), servicio de limpieza, cambio de s\u00E1banas y toallas una vez por semana; servicio conserjer\u00EDa de lunes a viernes de 9h a 18h; servicio de mantenimiento; tel\u00E9fono de asistencia 24h; sistema de seguridad CCTV 24h; kit de bienvenida; c\u00E1psulas Nespresso, infusiones, aguas, leche, zumo, amenities de ba\u00F1o, pastillas para lavadora y lavavajillas.\\n\\nDisponibilidad inmediata!\\n\\nLa finalidad del contrato es temporal.\\n\\nLa realidad del mobiliario puede no corresponder exactamente con las fotograf\u00EDas mostradas en este anuncio.\\n\\n   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario no ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u acyNumericId\":\"4737003828572\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/via-augusta/sarria-sant-gervasi/barcelona-capital/b83133b6-4a2b-4f1e-b708-c3589be2205a/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/sarria-sant-gervasi/s\",\"summary\":{\"title\":\"Piso Temporsl en alquiler en Sarri\u00E1\",\"description\":\"PISO DE CUATRO HABITACIONES CON VISTAS A BARCELONA\\n\\nCon una \u00F3ptima comunicaci\u00F3n con las salidas de la ciudad, tanto en transporte p\u00FAblico como en coche, y muy pr\u00F3ximo a la zona comercial de Major de Sarri\u00E0, encontramos este piso de 193m2 construidos amueblado y equipado.\\n\\nLa zona de d\u00EDa dispone de sal\u00F3n-comedor y recibidor amplio, los cuales est\u00E1n bien distribuidos y en los que se ubica un espacio para pasar buenos momentos en familia. Dispone, adem\u00E1s, de una amplia terraza.\\n\\nDispone de un total de cinco habitaciones exteriores, siendo cuatro dobles y una individual peque\u00F1a que puede ser utilizado como escritorio. Distribuidos en una zona de habitaci\u00F3n principal con ba\u00F1o propio, y otra zona con tres dormitorios que comparten un espacioso ba\u00F1o completo. Todas las habitaciones son amplias y cuentan con armarios empotrados, por lo que resulta ideal para una familia que busque espacio y confort en una de las mejores zonas residenciales de la ciudad.\\n\\nDispone de cocina con todos electrodom\u00E9sticos, con un espacio office muy agradable para poder comer o desayunar, y cuenta adem\u00E1s con un lavadero amplio y luminoso.\\n\\nLa vivienda tiene mucha luz y la zona de d\u00EDa goza de una maravillosa vista de la ciudad de Barcelona.\\n\\nNo se aceptan mascotas.\\n\\nPlaza de parking opcional en la misma finca.\\n\\nReci\u00E9n pintado.\\n\\nFinca con ascensor y porter\u00EDa.  \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 15,43 \u20AC / m2 \\nRespecto a la pr 80,\"floor\":\"FOURTH\",\"features\":{\"has\":[\"FURNISHED\",\"AIR_CONDITIONER\",\"LAUNDRY\",\"WARDROBES\",\"HOME_APPLIANCES\",\"BALCONY\",\"DOORMAN\",\"SUITE_BATHROOM\",\"EQUIPPED_KITCHEN\",\"ELEVATOR\",\"PRIVATE_PARKING\"],\"hasNot\":[\"STORAGE_ROOM\",\"GYM\",\"PETS_ALLOWED\",\"DRYER\",\"PRIVATE_GARDEN\",\"COMMUNITY_POOL\"]},\"orientation\":\"SOUTH\",\"heating\":\"NATURAL_GAS\",\"hotWater\":\"NATURAL_GAS\",\"energyEfficiencyCertificate\":{\"data\":{\"consumption\":{\"label\":\"E\",\"value\":159},\"emissions\":{\"label\":\"E\",\"value\":34}},\"status\":\"AVAILABLE\"},\"dynamicFeatures\":[\"IS_EXTERIOR\"]},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":3850,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"leadsapbcn@aproperties.es\",\"phone\":\"+34930191966\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/via-augusta/sarria-sant-gervasi/barcelona-capital/b83133b6-4a2b-4f1e-b708-c3589be2205a/d\",\"feature\":null,\"short\":\"/a/b83133b6-4a2b-4f1e-b708-c3589be2205a\"}},{\"id\":\"c15528a6-ee24-435c-b068-59b6cbc083d3\",\"reference\":\"AB2405033\",\"legacyNumericId\":\"4737003821315\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/pg-de-gracia/eixample/barcelona-capital/c15528a6-ee24-435c-b068-59b6cbc083d3/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/eixample/s\",\"summary\":{\"title\":\"Piso en alquiler en Paseo de Gracia\",\"description\":\"PISO DE 3 HABITACIONES EN EL EIXAMPLE\\n\\nDiponibilidad inmediata.\\n\\nEn la calle m\u00E1s pretigiosa de Barcelona ,Paseo de Gracia,nos encontramos  con  esta fant\u00E1stica vivienda de ensue\u00F1o en una superficie de 250 m2 totalmente amueblada con todo lo necesario para tener una estancia de lujo.\\n\\nLa zona de d\u00EDa cuenta con amplio y luminoso sal\u00F3n comedor. El detalle de la chimenea, la iluminaci\u00F3n y la paleta de color utilizada, solo muestra el cuidado con el que ha sido decorado, obteniendo una atm\u00F3sfera elegante y acogedora al mismo tiempo. Este vanguardista espacio, cuenta con 3 amplios ventanales que permiten el ingreso de luz natural, y sirven tambi\u00E9n de acceso hacia la terraza con vista hacia Paseo de Gracia, donde podr\u00E1s disfrutar de un caf\u00E9 por las ma\u00F1anas mientras disfrutas de la privilegiada vista hacia la imponente Casa Batll\u00F3.\\n\\nLa moderna y sofisticada cocina es independiente, ha sido totalmente equipada con todos los electrodom\u00E9sticos necesarios de alta gama para cocinar desde el d\u00EDa de llegada al piso, tales como cocina de vitrocer\u00E1mica, horno, microondas, lavavajillas, cafetera, tostadora e incluso cuenta con cava de vino climatizada. Al lado de la cocina, encontrar\u00E1s un moderno aseo para los visitantes.\\n\\nLa zona de noche consta de 3 habitaciones dobles. La primera habitaci\u00F3n es espaciosa y muy c\u00F3moda, tipo suite y tiene el ba\u00F1o completo con ducha; cuenta adem\u00E1s con escritorio y zona de vestidor. La segunda habitaci\u00F3n es luminosa, pues tiene acceso directo al balc\u00F3n. La tercera habitaci\u00F3n, tambi\u00E9n es tipo suite, pero en este caso, cuenta con una lujosa ba\u00F1era, perfecta para relajarse del d\u00EDa; adem\u00E1s tambi\u00E9n tiene balc\u00F3n y escritorio.\\n\\nUna cuarta habitaci\u00F3n equipada como despacho, resulta el lugar ideal para estudiar o trabajar en casa.\\n\\nLa finca cuenta con portero. El piso est\u00E1 dotado de alarma, aire acondicionado y calefacci\u00F3n por conducto.\\n\\n\\\"La realidad del mobiliario puede no corresponder exactamente con las fotograf\u00EDas mostradas en este anuncio\\\". \\n\\n   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 14,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nRenta del \u00FAltimo contrato de arrendamiento: 12.000,00 \u20AC\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2405033\\n\\nN\u00BA AICAT: 8446\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Eixample\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Pg. de Gr\u00E0cia\",\"streetNumber\":\"42\"},\"coordinates\":{\"latitude\":41.38827837097862,\"longitude\":2.170174499153177},\"displayAddressLine\":\"Pg. de Gr\u00E0cia\",\"displayZoneLine\":\"Eixample, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"Dreta de l'Eixample\",\"slug\":\"dreta-de-l-eixample\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Eixample\",\"slug\":\"eixample\"},{\"type\":\"street\",\"value\":\"Ronda Sant Pere\",\"slug\":\"ronda-sant-pere\"},{\"type\":\"street\",\"value\":\"Paseo Gracia\",\"slug\":\"paseo-gracia\"},{\"type\":\"street\",\"value\":\"Calle Casp\",\"slug\":\"calle-casp\"},{\"type\":\"street\",\"value\":\"Plaza Catalunya\",\"slug\":\"plaza-catalunya\"}],\"geography\":[{\"level\":\"country\",\"code\":\"724\"},{\"level\":\"autonomous-community\",\"code\":\"9\"},{\"level\":\"province\",\"code\":\"8\"},{\"level\":\"region\",\"code\":\"232\"},{\"level\":\"area\",\"code\":\"376\"},{\"level\":\"municipality\",\"cod s\":{\"opportunity\":false,\"premium\":false,\"priorityTier\":\"premium\",\"leaderModule\":false,\"expressVisit\":false},\"publisherProducts\":[\"LOGO_EN_PARRILLA\",\"MINISITE\",\"SBLR\"],\"updatedAt\":\"2026-08-06T14:27:30.8778994+02:00\"},\"property\":{\"propertyType\":\"flat\",\"propertySubtype\":\"flat\",\"status\":null,\"rooms\":4,\"bathrooms\":3,\"builtSurface\":250,\"landArea\":null,\"constructionYear\":1957,\"floor\":\"FIFTH\",\"features\":{\"has\":[\"FURNISHED\",\"AIR_CONDITIONER\",\"WARDROBES\",\"HOME_APPLIANCES\",\"BALCONY\",\"DOORMAN\",\"SUITE_BATHROOM\",\"EQUIPPED_KITCHEN\",\"ELEVATOR\"],\"hasNot\":[\"STORAGE_ROOM\",\"LAUNDRY\",\"GYM\",\"PETS_ALLOWED\",\"DRYER\",\"PRIVATE_GARDEN\",\"COMMUNITY_POOL\",\"PRIVATE_PARKING\"]},\"orientation\":\"EAST\",\"heating\":\"ELECTRIC\",\"hotWater\":\"ELECTRIC\",\"energyEfficiencyCertificate\":{\"status\":\"PENDING\"}},\"transaction\":{\"type\":\"rent\",\"price\":{\"amount\":12000,\"currency\":null,\"hidden\":false,\"priceDrop\":null,\"priceRaise\":null},\"pricePerSquareMeter\":null},\"contact\":{\"email\":\"leadsapbcn@aproperties.es\",\"phone\":\"+34930191968\"},\"urls\":{\"canonical\":\"/alquiler/planta-intermedia/pg-de-gracia/eixample/barcelona-capital/c15528a6-ee24-435c-b068-59b6cbc083d3/d\",\"feature\":null,\"short\":\"/a/c15528a6-ee24-435c-b068-59b6cbc083d3\"}},{\"id\":\"c7a76cae-3a7d-47ac-af4b-88821e57ec9a\",\"reference\":\"AB2406049-1\",\"legacyNumericId\":\"4737003821693\",\"kind\":\"secondHand\",\"navigationUrl\":\"/alquiler/planta-intermedia/trav-de-dalt/gracia/barcelona-capital/c7a76cae-3a7d-47ac-af4b-88821e57ec9a/d\",\"listingNavigationUrl\":\"/alquiler/viviendas/barcelona-provincia/barcelona-capital/gracia/s\",\"summary\":{\"title\":\"Piso en alquiler en Gr\u00E0cia\",\"description\":\"D\u00DAPLEX AMUEBLADO, A ESTRENAR, CON TERRAZA\\n\\nDisponibilidad inmediata!!\\n\\nNos encontramos en la zona alta del barrio de Gracia, en frente al parque Jardins de Men\u00E9ndez i Pelayo y a tan solo 500 metros del Park G\u00FCell, con una magn\u00EDfica vivienda de lujo. Este piso d\u00FAplex consta de una superficie aproximada de 230m2.\\n\\nLa vivienda ha sido decorada  por el reconocido estudio WIT Design Barcelona .En la zona de d\u00EDa nos encontramos con un amplio sal\u00F3n comedor con gran ventanal lo que proporciona  gran  luminosidad  y con salida a una gran terraza , una cocina de dise\u00F1o abierta equipada con todos los electrodom\u00E9sticos necesarios  de alta gama  hasta incluso el peque\u00F1o menaje, y un ba\u00F1o completo Bajamos unas escaleras y nos encontramos la zona de noche, un peque\u00F1o saloncito luminoso con un patio interior acristalado y  3 habitaciones dobles: una de ellas en suite, otra habitaci\u00F3n doble y otra doble  con dos camas individuales que comparten ba\u00F1o.\\n\\nEl edificio dispone de una terraza rooftop con mesas, tumbonas y chill-out, gimnasio y parking para Bicicletas y Patinetes.\\n\\nLa vivienda consta de una serie de servicios incluidos en el alquiler: suministros (agua, electricidad y WIFI), servicio de limpieza, cambio de s\u00E1banas y toallas una vez por semana, servicio conserjer\u00EDa de lunes a viernes de 9h a 18h,servicio de mantenimiento, tel\u00E9fono de asistencia 24h, sistema de seguridad CCTV 24h.\\n\\nKit de Bienvenida: capsulas Nespresso, infusiones, aguas, leche, zumo, amenities de ba\u00F1o, pastillas para lavadora y lavavajillas.\\n\\nLa finalidad del contrato es temporal.\\n\\nLa realidad del mobiliario puede no corresponder exactamente con las fotograf\u00EDas mostradas en este anuncio.\\n\\n   \\n* En cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\\n\u00CDndice de R.P.LL: 0,00 \u20AC / m2 \\nRespecto a la presente propiedad no existe certificado informativo estatal de referencia de precios de alquiler.\\nNo consta contrato de arrendamiento de vivienda en los \u00FAltimos 5 a\u00F1os.\\nEste propietario ostenta la condici\u00F3n de gran tenedor.\\nLa presente propiedad tiene la consideraci\u00F3n de suntuaria por raz\u00F3n de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicaci\u00F3n el \u00EDndice estatal de referencia de precios de alquiler.\\n Ref. AB2406049-1\\n\\nN\u00BA AICAT: 8446\\n\\nC\u00E9dula de habitabilidad: CHB02616024***\\nSe omiten los \u00FAltimos tres d\u00EDgitos para preservar el uso correcto de la informaci\u00F3n; el n\u00FAmero completo est\u00E1 disponible bajo solicitud de los interesados.\",\"location\":{\"visibility\":\"STREET\",\"municipality\":\"Barcelona Capital\",\"district\":\"Gr\u00E0cia\",\"region\":\"Barcelon\u00E8s\",\"province\":\"Barcelona\",\"address\":{\"streetName\":\"Trav. de Dalt\",\"streetNumber\":\"48\"},\"coordinates\":{\"latitude\":41.41036118780801,\"longitude\":2.155726034957297},\"displayAddressLine\":\"Trav. de Dalt\",\"displayZoneLine\":\"Gr\u00E0cia, Barcelona Capital\",\"layers\":[{\"type\":\"neighbourhood\",\"value\":\"La Salut\",\"slug\":\"la-salut\"},{\"type\":\"country\",\"value\":\"Espa\u00F1a\",\"slug\":\"espana\"},{\"type\":\"autonomous_community\",\"value\":\"Catalu\u00F1a\",\"slug\":\"cataluna\"},{\"type\":\"province\",\"value\":\"Barcelona\",\"slug\":\"barcelona\"},{\"type\":\"region\",\"value\":\"Barcelon\u00E8s\",\"slug\":\"barcelones\"},{\"type\":\"area\",\"value\":\"Barcelona, Zona de\",\"slug\":\"barcelona-zona-de\"},{\"type\":\"municipality\",\"value\":\"Barcelona Capital\",\"slug\":\"barcelona-capital\"},{\"type\":\"district\",\"value\":\"Gr\u00E0cia\",\"slug\":\"gracia\"},{\"type\":\"street\",\"value\":\"Calle Torrent de Les Flors\",\"slug\":\"calle-torrent-de-les-flors\"},{\"type\":\"street\",\"value\":\"Calle Lliri\",\"slug\":\"calle-lliri\"},{\"type\":\"street\",\"value\":\"Calle Larrard\",\"slug\":\"calle-larrard\"},{\"type\":\"street\",\"value\":\"Avenida Santuari S Josep Muntany\",\"slug\":\"avenida-santuari-s-josep-muntany\"},{\"type\":\"street\",\"value\":\"Calle Cardener\",\"slug\":\"calle-cardener\"},{\"type\":\"street\",\"value\":\"Call
