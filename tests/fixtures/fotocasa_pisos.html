/es/pro/habita-barcelona/","coordinates":{"latitude":41.3930840104142,"longitude":2.1505815319956825,"accuracy":0},"date":{"diff":0,"unit":"NOW","timestamp":1791537209120},"dateOriginal":{"diff":0,"unit":"NOW","timestamp":1791537209120},"description":"ALQUILER DE TEMPORADA, DISPONIBLE INMEDIATAMENTE HASTA 15 DE ENERO 2027\n\nUbicada en una de las direcciones más codiciadas de Barcelona, en una finca regia del Quadrat d'Or de la Dreta de l'Eixample, esta magnífica propiedad de 200 metros cuadrados redefine el concepto de exclusividad en el alquiler temporal. Situada en una segunda planta (tercero real) con ascensor, la vivienda ha sido íntegramente reformada y amueblada con un gusto exquisito, donde cada detalle ha sido pensado para ofrecer el máximo confort. El espacio de día se compone de un gran salón-comedor con cocina abierta y totalmente equipada, que se prolonga hacia una galería abierta habilitada como elegante zona de trabajo y una maravillosa terraza con orientación sur que inunda todo el ambiente de luz natural. La zona de descanso alberga tres dormitorios dobles, todos equipados con su propio vestidor; el principal cuenta con baño en suite, mientras que las otras dos habitaciones disponen de dos baños adicionales completos. La propiedad cuenta con aire acondicionado y bomba de calor por conductos, además de acabados y tecnología de vanguardia como lavadero independiente, toalleros calefactables digitales, vinoteca, chimenea eléctrica, iluminación inteligente y modernos sistemas de WC con ducha integrada. Una oportunidad única para disfrutar de una estancia temporal de alto standing en pleno corazón modernista de la ciudad.\nEn cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos:\nRenta del último contrato de arrendamiento: No estuvo alquilada anteriormente.\nEste propietario no ostenta la condición de gran tenedor.\nLa presente propiedad tiene la consideración de suntuaria por razón de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicación el índice estatal de referencia de precios de alquiler.\nHonorarios de agencia: 10% de la renta anual + IVA a cargo del arrendatario\nZona de mercado residencial tensionado.\nAICAT: 9770\nAPI: A12581.","detail":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-terraza-ascensor-amueblado-television/191067444/d"},"detailWithParams":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-terraza-ascensor-amueblado-television/191067444/d?from=list"},"dynamicFeatures":[],"externalContactUrl":null,"features":[{"key":"air_conditioner","value":1,"maxValue":0,"minValue":0},{"key":"cabinets","value":2,"maxValue":0,"minValue":0},{"key":"heating","value":3,"maxValue":0,"minValue":0},{"key":"parquet","value":9,"maxValue":0,"minValue":0},{"key":"terrace","value":10,"maxValue":0,"minValue":0},{"key":"elevator","value":13,"maxValue":0,"minValue":0},{"key":"kitchen_office","value":15,"maxValue":0,"minValue":0},{"key":"ensuite_bathroom","value":18,"maxValue":0,"minValue":0},{"key":"furnished","value":19,"maxValue":0,"minValue":0},{"key":"household_appliances","value":21,"maxValue":0,"minValue":0},{"key":"oven","value":22,"maxValue":0,"minValue":0},{"key":"washing_machine","value":23,"maxValue":0,"minValue":0},{"key":"microwave","value":24,"maxValue":0,"minValue":0},{"key":"fridge","value":25,"maxValue":0,"minValue":0},{"key":"tv","value":29,"maxValue":0,"minValue":0},{"key":"balcony","value":32,"maxValue":0,"minValue":0},{"key":"laundry","value":109,"maxValue":0,"minValue":0},{"key":"equiped_kitchen","value":131,"maxValue":0,"minValue":0},{"key":"bathrooms","value":3,"maxValue":0,"minValue":0},{"key":"conservationStatus","value":1,"maxValue":0,"minValue":0},{"key":"floor","value":7,"maxValue":0,"minValue":0},{"key":"hotWater","value":2,"maxValue":0,"minValue":0},{"key":"rooms","value":3,"maxValue":0,"minValue":0},{"key":"surface","value":200,"maxValue":0,"minValue":0}],"hasListLogo":true,"hasPhoneVisibility":tr a carpintería de aluminio con doble acristalamiento que proporciona un aislamiento térmico y acústico absoluto. Todo ello se encuentra en un edificio señorial con un imponente hall de entrada, dos ascensores y servicio de conserjería, rodeado de las mejores boutiques de lujo y restaurantes de la ciudad, y listo para entrar a vivir con solo las maletas.\n\nPRECIO: 2.200 €/mes\n\nA cuenta suministros: 250€/mes\n\nLimpieza final: 200€\n\nEn cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\n\nRenta del último contrato de arrendamiento: N/A\n\nEste propietario no ostenta la condición de gran tenedor.\n\nÍndice de referencia de alquiler: No aplica para este tipo de contratos\n\nZona de mercado residencial tensionado\n\nAICAT: 9770\n\nAPI: A12581.","detail":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-ascensor-amueblado-television/191064190/d"},"detailWithParams":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-ascensor-amueblado-television/191064190/d?from=list"},"dynamicFeatures":["IS_EXTERIOR","IS_TEMPORARY"],"externalContactUrl":null,"features":[{"key":"air_conditioner","value":1,"maxValue":0,"minValue":0},{"key":"cabinets","value":2,"maxValue":0,"minValue":0},{"key":"heating","value":3,"maxValue":0,"minValue":0},{"key":"parquet","value":9,"maxValue":0,"minValue":0},{"key":"elevator","value":13,"maxValue":0,"minValue":0},{"key":"ensuite_bathroom","value":18,"maxValue":0,"minValue":0},{"key":"furnished","value":19,"maxValue":0,"minValue":0},{"key":"household_appliances","value":21,"maxValue":0,"minValue":0},{"key":"oven","value":22,"maxValue":0,"minValue":0},{"key":"washing_machine","value":23,"maxValue":0,"minValue":0},{"key":"microwave","value":24,"maxValue":0,"minValue":0},{"key":"fridge","value":25,"maxValue":0,"minValue":0},{"key":"porter_service","value":28,"maxValue":0,"minValue":0},{"key":"tv","value":29,"maxValue":0,"minValue":0},{"key":"equiped_kitchen","value":131,"maxValue":0, anso, convivencia y trabajo.\n* Cuatro habitaciones dobles, incluyendo dos suites, ofreciendo privacidad y comodidad tanto para familias como para quienes buscan dormitorios de grandes dimensiones.\n* Tres baños completos y un aseo adicional, una configuración especialmente práctica para una vivienda de estas dimensiones y para el día a día de varios residentes.\n* Reforma reciente, que actualiza la vivienda y permite disfrutar de espacios cuidados sin renunciar a la amplitud característica de las viviendas del Eixample.\n* Grandes zonas de día, con una distribución que permite crear un salón confortable, comedor y diferentes ambientes adaptados a las necesidades de cada residente.\n* Cocina completamente equipada, diseñada para facilitar el uso cotidiano y acompañada de un lavadero independiente que aporta funcionalidad adicional.\n* Balcón exterior, un espacio que aporta conexión con el exterior y permite disfrutar de aire fresco desde la propia vivienda.\n* Luminosidad y amplitud visual, favorecidas por su condición exterior, orientación noroeste y grandes superficies acristaladas.\n* Confort durante todo el año, gracias a la combinación de calefacción central y aire acondicionado por conductos.\n* Amplio espacio de almacenamiento, con armarios empotrados integrados en la vivienda para mantener el orden sin sacrificar superficie útil.\n* Acabados cálidos y elegantes, con suelo de madera y carpintería de aluminio con doble acristalamiento.\n* Edificio con ascensor, aportando comodidad a una vivienda de grandes dimensiones situada en una planta elevada.\n\nFICHA TECNICO:\nEste amplio piso de 241 m² construidos y 193,49 m² útiles se encuentra en la primera planta de un edificio con ascensor en L'Antiga Esquerra de l'Eixample, Barcelona Capital. La vivienda dispone de cuatro habitaciones dobles, de las cuales dos son suites, y cuenta con tres baños completos más un aseo, ideal para familias o grupos que buscan comodidad y privacidad. La propiedad ha sido reformada, conservando su encanto gracias a sus suelos de madera y su carpintería interior y exterior de aluminio con vidrios dobles, que garantiza buen aislamiento.\n\nAdemás, el piso cuenta con calefacción central y aire acondicionado por conductos, asegurando una temperatura agradable durante todo el año. Su orientación noroeste permite que sea un espacio soleado y luminoso. Entre sus comodidades, se incluyen armarios empotrados, un lavadero, balcón y línea telefónica.\n\nEl edificio tiene pocos vecinos por planta, solo dos, lo que aporta mayor tranquilidad. La ubicación en L'Antiga Esquerra de l'Eixample no solo ofrece un entorno residencial consolidado sino también la proximidad a servicios y buena conexión con el resto de la ciudad, proporcionando una calidad de vida óptima para sus residentes.\n\nUBICACIÓN\nL’Antiga Esquerra de l’Eixample es una de las zonas residenciales más consolidadas y valoradas de Barcelona, caracterizada por su arquitectura, sus amplias calles y una excelente oferta de servicios para el día a día.\nLa vivienda se encuentra en un entorno que combina tranquilidad residencial con la proximidad a comercios, restaurantes, centros culturales y diferentes opciones de transporte. Una ubicación especialmente atractiva para quienes buscan disfrutar de la vida urbana de Barcelona desde un barrio con identidad propia y excelentes conexiones.\n\nSOBRE ALL4FLAT\nSomos una agencia Real Estate situada en Barcelona.\nNuestro trabajo consiste en ayudar en todos los trámites y etapas necesarios para la intermediación de propiedades inmobiliarias.\nDisponemos de un extenso portafolio de productos que incluye todo tipo de bienes inmuebles para compra o alquiler. Además, ofrecemos servicios inmobiliarios complementarios como reformas parciales o integrales, administraciones verticales y/o horizontales, soluciones de financiación, tramitación de seguros y asesoramiento legal y fiscal.\nOfrecemos servicios profesionales garantizando la calidad y la integridad de nuestro {"diff":21,"unit":"HOURS","timestamp":1791454376773},"description":"Ubicado en un edificio catalogado con ascensor, este espectacular piso en la Plaza Vila de Madrid ofrece una combinación perfecta de historia, luz y amplitud. Con una superficie de 147 m², destaca por sus vistas despejadas al Cementerio Romano y un encantador balcón orientado hacia un bonito patio de manzana, permitiendo la entrada de luz natural durante todo el día y una ventilación continua.\n\nEl espacioso recibidor da paso a una vivienda completamente reformada en 2025 con acabados de alta gama. Dispone de cuatro habitaciones, dos de ellas dobles con acceso al balcón, otra doble y una más pequeña con sofá cama. El salón es amplio y luminoso, con grandes ventanales que crean un ambiente acogedor y relajante.\n\nCuenta con dos baños completos, uno de ellos con el WC separado para mayor comodidad. La cocina, moderna y totalmente equipada, combina funcionalidad y diseño. El piso incluye aire acondicionado por conductos, calefacción, parquet macizo, persianas eléctricas y una zona de lavadero con lavadora y secadora.\n\nUna vivienda única en el corazón del casco antiguo de Barcelona, donde la tranquilidad y la exclusividad se fusionan con la historia y el encanto del barrio.\nSituado en una de las zonas más privilegiadas de Barcelona. Cultura, arquitectura, arte y gastronomía se unen en esta zona de la ciudad donde hay tantas cosas que hacer y visitar. El piso se encuentra entre Portal de l'Àngel y Las Ramblas. A minutos de la Catedral de Barcelona, el cementerio romano, Iglesia de Santa Anna, la hermosa placeta del Pi, El Teatro Liceu y entre otros, Una verdadera joya en la parte alta del Barrio Gótico. Su proximidad a Plaza Catalunya donde se encuentran diferentes líneas de metro, trenes, taxis y autobuses permiten una rápida conexión con el resto de la ciudad y sus alrededores incluido el aeropuerto. Y si disfrutas de un agradable paseo por el centro histórico con hermosos paisajes del casco antig orios y despacho: Cuenta con 2 habitaciones (el dormitorio principal con cama doble, vistas a la vegetación y gran armario con puertas de espejo) más un espacio adicional multifuncional, perfecto como despacho para el teletrabajo.\n- Baños y confort: Baño completo y aseo de cortesía. Equipado con calefacción, aire acondicionado en la zona de día e internet de alta velocidad.\n- Listo para entrar a vivir: Entregado completamente amueblado y equipado con todos los enseres necesarios.\n- plaza de garaje opcional +150€ adicional\nUbicación inmejorable: La Vila de Gràcia\n\nUbicado en la calle Verdi, a un paso de los célebres Cines Verdi, comercios de proximidad, cafés de especialidad, restaurantes y las plazas más emblemáticas del barrio (Sol, Virreina, Revolució). Vive la esencia de Gràcia a pie de calle y la máxima paz al cruzar la puerta de casa.\n\nCONDICIONES DEL ARRENDAMIENTO\n\n- Modalidad: Arrendamiento de temporada destinado exclusivamente a finalidad recreativa, vacacional o de ocio (estancia mínima de 32 días). Se requerirá acreditación documental del motivo de la temporalidad y del domicilio habitual del arrendatario.\n- Renta mensual: 2.100 €/mes (Internet de alta velocidad incluido).\n- Suministros: Electricidad, agua y gas no incluidos. Provisión mensual de 250 € a regularizar según facturas reales.\n- Fianza: La legalmente correspondiente según duración y modalidad.\n- Garantía adicional: 1 mes de renta (2.100 €).\n- Ocupación máxima: 3 personas.\nUbicación inmejorable: La Vila de Gràcia\n\nUbicado en la calle Verdi, a un paso de los célebres Cines Verdi, comercios de proximidad, cafés de especialidad, restaurantes y las plazas más emblemáticas del barrio (Sol, Virreina, Revolució). Vive la esencia de Gràcia a pie de calle y la máxima paz al cruzar la puerta de casa.\n\nTEMPORADA VACACIONAL O RECREATIVA\n\nInformación de Transparencia (Ley 12/2023 y 11/2025):\n\nNº AICAT: 8446\n\n1. Zona de mercado residencial tensionado (ZMRT): SÍ\n\n2. Gran Tenedor: No ias comerciales y culturales de la ciudad. Gracias a su ubicación estratégica, disfrutarás de una excelente conexión con el transporte público (metro, autobuses y estaciones de Bicing), además de una gran variedad de tiendas, supermercados, restaurantes y espacios culturales. Ideal para quienes desean vivir en el corazón de la ciudad, con todo lo necesario a su alrededor.\n\nSOBRE ALL4FLAT\nSomos una agencia Real Estate situada en Barcelona. Nuestro trabajo consiste en ayudar en todos los trámites y etapas necesarios para la intermediación de propiedades inmobiliarias. Disponemos de un extenso portafolio de productos que incluyen todo tipo de bienes inmuebles para compra o alquiler. Además, ofrecemos servicios inmobiliarios de calidad complementarios como: reformas parciales o integrales, administraciones verticales y/o horizontales, soluciones de financiación, tramitación de seguros y asesoramiento legal y fiscal. Ofrecemos servicios profesionales garantizando la calidad y la integridad de nuestro servicio para obtener el éxito de la compañía.","detail":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-amueblado/191057554/d"},"detailWithParams":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-amueblado/191057554/d?from=list"},"dynamicFeatures":["IS_EXTERIOR","IS_TEMPORARY"],"externalContactUrl":null,"features":[{"key":"air_conditioner","value":1,"maxValue":0,"minValue":0},{"key":"cabinets","value":2,"maxValue":0,"minValue":0},{"key":"parquet","value":9,"maxValue":0,"minValue":0},{"key":"furnished","value":19,"maxValue":0,"minValue":0},{"key":"balcony","value":32,"maxValue":0,"minValue":0},{"key":"alarm","value":77,"maxValue":0,"minValue":0},{"key":"equiped_kitchen","value":131,"maxValue":0,"minValue":0},{"key":"antiquity","value":9,"maxValue":0,"minValue":0},{"key":"bathrooms","value":2,"maxValue":0,"minValue":0},{"key":"conservationStatus","value":8,"maxValue":0,"minValue":0},{"key":"floor","value":8,"maxValue":0,"minValue":0 e Referencia de precios:  916,17 €\nZona tensionada: Sí \nEstado: Segunda Mano\nSituación últimos 5 años: Alquilado\nPrecio de la última renta: 1200 € / Año 2023\nCertificado energético: E / E caducada\nCedula: ??\n¿El propietario gran tenedor?: No\nAicat: 9349\n\nCARACTERISTICAS\nPiso moderno de 71M2: \n- Hay 3 habitaciones dobles con armarios empotrados.\n- Tiene 1 baño completo con ducha y aseo.\n- Un salón/comedor amplio y luminoso.\n- Cocina totalmente equipada \n- Totalmente amueblado\n- Aire acondicionado, calefacción.\n\nUBICACIÓN\nSant Martí, en el noreste de Barcelona. Está delimitado por calles y avenidas importantes como Gran Via de les Corts catalanes, Carrer d’Aragó y Avinguda Meridiana. El barrio está bien comunicado con los trenes de Cercanías (R2 Nord, R2 y R1), y la línea R11 de Barcelona a Portbou. \nHay la estación de metro del Clot (L1 y L2) y quedan muy cerca las estaciones de Navas, Glòries y Encants. Hay buenas conexiones con autobuses de TMB y dos paradas de tranvía (Trambesòs: T5): la Farinera y Can Jaumandreu.\"\n\nSOBRE ALL4FLAT :\nSomos una agencia inmobiliaria ubicada en Barcelona.\nNuestro trabajo consiste en ayudar en todas las gestiones y etapas necesarias para la intermediación de propiedades inmobiliarias.\nDisponemos de una amplia gama de productos que incluyen todo tipo de bienes muebles para su compra o venta. Además, ofrecemos servicios inmobiliarios de calidad complementarios como: reformas parciales o integrales, administraciones verticales y/o horizontales, soluciones de financiación, tramitación de seguros y asesoramiento legal y fiscal.\nOfrecemos servicios profesionales garantizando la calidad y la integridad de nuestro servicio para obtener el éxito de la compañía.\n","detail":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-ascensor-amueblado/191053530/d"},"detailWithParams":{"es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-ascensor-amueblado/191053530/d?from=list"},"dynamicFeature -a688-4c51-8fc5-986f627690fb/20250319170904?rule=original","brandInfo":{"barColor":"#D23A4E","logo":null,"textColor":"#FFFFFF"},"phone":"+34934344795","isTrackedPhone":true,"parent":null,"clientUrl":"/es/pro/habita-barcelona/","transactionTypeId":3,"rawPrice":7000,"price":7000,"reducedPrice":null,"periodicityId":3,"detail":{"ca-ES":"/ca/lloguer/vivenda/barcelona-capital/aire-condicionat-calefaccio-terrassa-ascensor-moblat-televisio/191067444/d","de-DE":"/de/miete/wohnimmobilie/barcelona-capital/aire-acondicionado-heizung-terrasse-fahrstuhl-mobliert-television/191067444/d","en-GB":"/en/rental/home/barcelona-capital/air-conditioning-heating-terrace-lift-furnished-television/191067444/d","es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-terraza-ascensor-amueblado-television/191067444/d"},"detailWithParams":{"ca-ES":"/ca/lloguer/vivenda/barcelona-capital/aire-condicionat-calefaccio-terrassa-ascensor-moblat-televisio/191067444/d?from=list","de-DE":"/de/miete/wohnimmobilie/barcelona-capital/aire-acondicionado-heizung-terrasse-fahrstuhl-mobliert-television/191067444/d?from=list","en-GB":"/en/rental/home/barcelona-capital/air-conditioning-heating-terrace-lift-furnished-television/191067444/d?from=list","es-ES":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-terraza-ascensor-amueblado-television/191067444/d?from=list"},"promotionUrl":null,"address":{"isExact":false,"street":{"name":"Carrer de Muntaner","number":0,"type":null},"autonomousCommunity":"Cataluña","coordinates":{"lat":41.3930840104142,"lng":2.1505815319956825},"country":"España","district":"Barcelona, Zona de","level6":null,"locality":"Barcelona","ubication":"Carrer de Muntaner, L'Antiga Esquerra de l'Eixample","locationIds":{"autonomousCommunityId":9,"countryId":724,"provinceId":8,"regionId":232,"districtId":376,"localityId":8019,"level6Id":0,"municipalityId":1151,"neighborhoodId":279,"combinedLocationIdsString":"724,9,8,232,376,8019,0,1151,279"},"municipality":"Eixample","neighborhood":"L'Antiga Esquerra de l'Eixample","province":"Barcelona","region":"Barcelonès","visibilityMode":2,"zipCode":"08036","upperLevel":"L'Antiga Esquerra de l'Eixample"},"description":"ALQUILER DE TEMPORADA, DISPONIBLE INMEDIATAMENTE HASTA 15 DE ENERO 2027\n\nUbicada en una de las direcciones más codiciadas de Barcelona, en una finca regia del Quadrat d'Or de la Dreta de l'Eixample, esta magnífica propiedad de 200 metros cuadrados redefine el concepto de exclusividad en el alquiler temporal. Situada en una segunda planta (tercero real) con ascensor, la vivienda ha sido íntegramente reformada y amueblada con un gusto exquisito, donde cada detalle ha sido pensado para ofrecer el máximo confort. El espacio de día se compone de un gran salón-comedor con cocina abierta y totalmente equipada, que se prolonga hacia una galería abierta habilitada como elegante zona de trabajo y una maravillosa terraza con orientación sur que inunda todo el ambiente de luz natural. La zona de descanso alberga tres dormitorios dobles, todos equipados con su propio vestidor; el principal cuenta con baño en suite, mientras que las otras dos habitaciones disponen de dos baños adicionales completos. La propiedad cuenta con aire acondicionado y bomba de calor por conductos, además de acabados y tecnología de vanguardia como lavadero independiente, toalleros calefactables digitales, vinoteca, chimenea eléctrica, iluminación inteligente y modernos sistemas de WC con ducha integrada. Una oportunidad única para disfrutar de una estancia temporal de alto standing en pleno corazón modernista de la ciudad.\nEn cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos:\nRenta del último contrato de arrendamiento: No estuvo alquilada anteriormente.\nEste propietario no ostenta la condición de gran tenedor.\nLa presente propiedad tiene la consideración de suntuaria por razón de superficie y/o renta, y por ello, de conformidad con la LAU, no es de aplicación el índice estatal de refere ribución impecable en dos niveles. Al entrar, un bonito recibidor da la bienvenida y conduce a un dormitorio doble con dos camas, a un baño completo con ducha y a una cocina office de alta gama totalmente equipada con nevera, lavadora, secadora, lavavajillas y horno. El gran protagonista de la planta baja es su impresionante salón-comedor de 35 m², caracterizado por techos altos abovedados y una preciosa galería acristalada circular que baña el espacio de luz natural mientras ofrece vistas exclusivas al Paseo de Gracia. Desde aquí, una cómoda escalera sube a la planta superior, donde se ubica la suite principal de unos 18 m², un oasis privado que cuenta con un gran vestidor y un segundo baño completo con ducha. Toda la vivienda presenta acabados de excelente calidad, como suelos de parquet de gama alta, calefacción individual, aire acondicionado y una carpintería de aluminio con doble acristalamiento que proporciona un aislamiento térmico y acústico absoluto. Todo ello se encuentra en un edificio señorial con un imponente hall de entrada, dos ascensores y servicio de conserjería, rodeado de las mejores boutiques de lujo y restaurantes de la ciudad, y listo para entrar a vivir con solo las maletas.\n\nPRECIO: 2.200 €/mes\n\nA cuenta suministros: 250€/mes\n\nLimpieza final: 200€\n\nEn cumplimiento de la Ley 12/2023 y la Ley 18/2007 informamos que:\n\nRenta del último contrato de arrendamiento: N/A\n\nEste propietario no ostenta la condición de gran tenedor.\n\nÍndice de referencia de alquiler: No aplica para este tipo de contratos\n\nZona de mercado residencial tensionado\n\nAICAT: 9770\n\nAPI: A12581.","location":"Barcelona, Barcelona","locationCardView":{"address":"Passeig de Gràcia, Eixample","zone":"Barcelona, Barcelona","municipality":"Eixample","locality":"Barcelona"},"detailUrl":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-ascensor-amueblado-television/191064190/d","features":[{"key":"bathrooms","value":2,"minValue":0,"maxValue":0},{"  uso cotidiano y acompañada de un lavadero independiente que aporta funcionalidad adicional.\n* Balcón exterior, un espacio que aporta conexión con el exterior y permite disfrutar de aire fresco desde la propia vivienda.\n* Luminosidad y amplitud visual, favorecidas por su condición exterior, orientación noroeste y grandes superficies acristaladas.\n* Confort durante todo el año, gracias a la combinación de calefacción central y aire acondicionado por conductos.\n* Amplio espacio de almacenamiento, con armarios empotrados integrados en la vivienda para mantener el orden sin sacrificar superficie útil.\n* Acabados cálidos y elegantes, con suelo de madera y carpintería de aluminio con doble acristalamiento.\n* Edificio con ascensor, aportando comodidad a una vivienda de grandes dimensiones situada en una planta elevada.\n\nFICHA TECNICO:\nEste amplio piso de 241 m² construidos y 193,49 m² útiles se encuentra en la primera planta de un edificio con ascensor en L'Antiga Esquerra de l'Eixample, Barcelona Capital. La vivienda dispone de cuatro habitaciones dobles, de las cuales dos son suites, y cuenta con tres baños completos más un aseo, ideal para familias o grupos que buscan comodidad y privacidad. La propiedad ha sido reformada, conservando su encanto gracias a sus suelos de madera y su carpintería interior y exterior de aluminio con vidrios dobles, que garantiza buen aislamiento.\n\nAdemás, el piso cuenta con calefacción central y aire acondicionado por conductos, asegurando una temperatura agradable durante todo el año. Su orientación noroeste permite que sea un espacio soleado y luminoso. Entre sus comodidades, se incluyen armarios empotrados, un lavadero, balcón y línea telefónica.\n\nEl edificio tiene pocos vecinos por planta, solo dos, lo que aporta mayor tranquilidad. La ubicación en L'Antiga Esquerra de l'Eixample no solo ofrece un entorno residencial consolidado sino también la proximidad a servicios y buena conexión con el resto de la ciudad, proporcionando una calidad de vida óptima para sus residentes.\n\nUBICACIÓN\nL’Antiga Esquerra de l’Eixample es una de las zonas residenciales más consolidadas y valoradas de Barcelona, caracterizada por su arquitectura, sus amplias calles y una excelente oferta de servicios para el día a día.\nLa vivienda se encuentra en un entorno que combina tranquilidad residencial con la proximidad a comercios, restaurantes, centros culturales y diferentes opciones de transporte. Una ubicación especialmente atractiva para quienes buscan disfrutar de la vida urbana de Barcelona desde un barrio con identidad propia y excelentes conexiones.\n\nSOBRE ALL4FLAT\nSomos una agencia Real Estate situada en Barcelona.\nNuestro trabajo consiste en ayudar en todos los trámites y etapas necesarios para la intermediación de propiedades inmobiliarias.\nDisponemos de un extenso portafolio de productos que incluye todo tipo de bienes inmuebles para compra o alquiler. Además, ofrecemos servicios inmobiliarios complementarios como reformas parciales o integrales, administraciones verticales y/o horizontales, soluciones de financiación, tramitación de seguros y asesoramiento legal y fiscal.\nOfrecemos servicios profesionales garantizando la calidad y la integridad de nuestro servicio en cada operación.\n","location":"Barcelona, Barcelona","locationCardView":{"address":"Avenida Diagonal, Eixample","zone":"Barcelona, Barcelona","municipality":"Eixample","locality":"Barcelona"},"detailUrl":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-calefaccion-ascensor/191059236/d","features":[{"key":"antiquity","value":8,"minValue":0,"maxValue":0},{"key":"bathrooms","value":4,"minValue":0,"maxValue":0},{"key":"conservationStatus","value":8,"minValue":0,"maxValue":0},{"key":"floor","value":6,"minValue":0,"maxValue":0},{"key":"orientation","value":2,"minValue":0,"maxValue":0},{"key":"rooms","value":4,"minValue":0,"maxValue":0},{"key":"surface","value":241,"minValue":0,"maxValue":0}],"multimedia":[{"position":1,"room 50"},"municipality":"Ciutat Vella","neighborhood":"Barri Gòtic","province":"Barcelona","region":"Barcelonès","visibilityMode":3,"zipCode":"08002","upperLevel":"Barri Gòtic"},"description":"Ubicado en un edificio catalogado con ascensor, este espectacular piso en la Plaza Vila de Madrid ofrece una combinación perfecta de historia, luz y amplitud. Con una superficie de 147 m², destaca por sus vistas despejadas al Cementerio Romano y un encantador balcón orientado hacia un bonito patio de manzana, permitiendo la entrada de luz natural durante todo el día y una ventilación continua.\n\nEl espacioso recibidor da paso a una vivienda completamente reformada en 2025 con acabados de alta gama. Dispone de cuatro habitaciones, dos de ellas dobles con acceso al balcón, otra doble y una más pequeña con sofá cama. El salón es amplio y luminoso, con grandes ventanales que crean un ambiente acogedor y relajante.\n\nCuenta con dos baños completos, uno de ellos con el WC separado para mayor comodidad. La cocina, moderna y totalmente equipada, combina funcionalidad y diseño. El piso incluye aire acondicionado por conductos, calefacción, parquet macizo, persianas eléctricas y una zona de lavadero con lavadora y secadora.\n\nUna vivienda única en el corazón del casco antiguo de Barcelona, donde la tranquilidad y la exclusividad se fusionan con la historia y el encanto del barrio.\nSituado en una de las zonas más privilegiadas de Barcelona. Cultura, arquitectura, arte y gastronomía se unen en esta zona de la ciudad donde hay tantas cosas que hacer y visitar. El piso se encuentra entre Portal de l'Àngel y Las Ramblas. A minutos de la Catedral de Barcelona, el cementerio romano, Iglesia de Santa Anna, la hermosa placeta del Pi, El Teatro Liceu y entre otros, Una verdadera joya en la parte alta del Barrio Gótico. Su proximidad a Plaza Catalunya donde se encuentran diferentes líneas de metro, trenes, taxis y autobuses permiten una rápida conexión con el resto de la ciudad y sus alrededores incluido el aeropuerto. Y si disfrutas de un agradable paseo por el centro histórico con hermosos paisajes del casco antiguo puedes llegar fácilmente al Puerto y a la playa.\n\nTEMPORADA USOS ART. 66 BIS 2\n\nInformación de Transparencia (Ley 12/2023 y 11/2025):\n\nNº AICAT: 8446\n\n1. Zona de mercado residencial tensionado (ZMRT): SÍ\n\n2. Gran Tenedor: Si // No\n\n3. Motivo de temporalidad: Uso destinado a estudios, trabajo, salud. etc, debidamente acreditado.\n\n4. Criterio utilizado para fijar la renta mensual: \n\nRenta contrato anterior: 3.000 eur/ mes\n\n5. Numero de Registro CEE: XXXXXXXXS\n\n6. Certificado de presencia o ausencia de materiales que contienen amianto: en trámite.","location":"Barcelona, Barcelona","locationCardView":{"address":"Ciutat Vella","zone":"Barcelona, Barcelona","municipality":"Ciutat Vella","locality":"Barcelona"},"detailUrl":"/es/alquiler/vivienda/barcelona-capital/calefaccion-ascensor-amueblado/191057906/d","features":[{"key":"antiquity","value":8,"minValue":0,"maxValue":0},{"key":"bathrooms","value":2,"minValue":0,"maxValue":0},{"key":"conservationStatus","value":1,"minValue":0,"maxValue":0},{"key":"floor","value":8,"minValue":0,"maxValue":0},{"key":"hotWater","value":1,"minValue":0,"maxValue":0},{"key":"rooms","value":4,"minValue":0,"maxValue":0},{"key":"surface","value":147,"minValue":0,"maxValue":0}],"multimedia":[{"position":1,"roomType":"exterior","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/ded02ec9-7391-47fc-8877-1dbcc3c6c0ff?rule=original","src":"https://static.fotocasa.es/images/ads/ded02ec9-7391-47fc-8877-1dbcc3c6c0ff?rule=original"},{"position":2,"roomType":"dining room","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ads/579883aa-9e91-46d8-952f-d7dbcec86d9f?rule=original","src":"https://static.fotocasa.es/images/ads/579883aa-9e91-46d8-952f-d7dbcec86d9f?rule=original"},{"position":3,"roomType":"living room","typeId":2,"type":"image","url":"https://static.fotocasa.es/images/ad o.\n- Baños y confort: Baño completo y aseo de cortesía. Equipado con calefacción, aire acondicionado en la zona de día e internet de alta velocidad.\n- Listo para entrar a vivir: Entregado completamente amueblado y equipado con todos los enseres necesarios.\n- plaza de garaje opcional +150€ adicional\nUbicación inmejorable: La Vila de Gràcia\n\nUbicado en la calle Verdi, a un paso de los célebres Cines Verdi, comercios de proximidad, cafés de especialidad, restaurantes y las plazas más emblemáticas del barrio (Sol, Virreina, Revolució). Vive la esencia de Gràcia a pie de calle y la máxima paz al cruzar la puerta de casa.\n\nCONDICIONES DEL ARRENDAMIENTO\n\n- Modalidad: Arrendamiento de temporada destinado exclusivamente a finalidad recreativa, vacacional o de ocio (estancia mínima de 32 días). Se requerirá acreditación documental del motivo de la temporalidad y del domicilio habitual del arrendatario.\n- Renta mensual: 2.100 €/mes (Internet de alta velocidad incluido).\n- Suministros: Electricidad, agua y gas no incluidos. Provisión mensual de 250 € a regularizar según facturas reales.\n- Fianza: La legalmente correspondiente según duración y modalidad.\n- Garantía adicional: 1 mes de renta (2.100 €).\n- Ocupación máxima: 3 personas.\nUbicación inmejorable: La Vila de Gràcia\n\nUbicado en la calle Verdi, a un paso de los célebres Cines Verdi, comercios de proximidad, cafés de especialidad, restaurantes y las plazas más emblemáticas del barrio (Sol, Virreina, Revolució). Vive la esencia de Gràcia a pie de calle y la máxima paz al cruzar la puerta de casa.\n\nTEMPORADA VACACIONAL O RECREATIVA\n\nInformación de Transparencia (Ley 12/2023 y 11/2025):\n\nNº AICAT: 8446\n\n1. Zona de mercado residencial tensionado (ZMRT): SÍ\n\n2. Gran Tenedor: No\n\n3. El inmueble se arrienda única y exclusivamente por uso vacacional o recreativo, por lo que NO aplica el sistema de contención de rentas, siendo la renta libremente pactada por las partes.\n\n4. Numero de Registro CEE: XXX l día.\n\nUBICACIÓN:\nEste estudio se encuentra en el centro de Barcelona, en una zona muy bien conectada y con todos los servicios a pocos pasos. Ubicado en el barrio del Raval, ofrece cercanía a puntos clave como Plaça Universitat, Plaça Catalunya y algunas de las principales arterias comerciales y culturales de la ciudad. Gracias a su ubicación estratégica, disfrutarás de una excelente conexión con el transporte público (metro, autobuses y estaciones de Bicing), además de una gran variedad de tiendas, supermercados, restaurantes y espacios culturales. Ideal para quienes desean vivir en el corazón de la ciudad, con todo lo necesario a su alrededor.\n\nSOBRE ALL4FLAT\nSomos una agencia Real Estate situada en Barcelona. Nuestro trabajo consiste en ayudar en todos los trámites y etapas necesarios para la intermediación de propiedades inmobiliarias. Disponemos de un extenso portafolio de productos que incluyen todo tipo de bienes inmuebles para compra o alquiler. Además, ofrecemos servicios inmobiliarios de calidad complementarios como: reformas parciales o integrales, administraciones verticales y/o horizontales, soluciones de financiación, tramitación de seguros y asesoramiento legal y fiscal. Ofrecemos servicios profesionales garantizando la calidad y la integridad de nuestro servicio para obtener el éxito de la compañía.","location":"Barcelona, Barcelona","locationCardView":{"address":"Calle Lluna, Ciutat Vella","zone":"Barcelona, Barcelona","municipality":"Ciutat Vella","locality":"Barcelona"},"detailUrl":"/es/alquiler/vivienda/barcelona-capital/aire-acondicionado-amueblado/191057554/d","features":[{"key":"antiquity","value":9,"minValue":0,"maxValue":0},{"key":"bathrooms","value":2,"minValue":0,"maxValue":0},{"key":"conservationStatus","value":8,"minValue":0,"maxValue":0},{"key":"floor","value":8,"minValue":0,"maxValue":0},{"key":"orientation","value":7,"minValue":0,"maxValue":0},{"key":"rooms","value":1,"minValue":0,"maxValue":0},{"key":"surface","value":29,"min
